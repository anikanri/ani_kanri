<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>アニ管理 - 検索</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; font-family: 'Noto Sans JP', sans-serif; background-color: #f4f6f9; color: #333; }
        main { flex: 1; padding: 120px 0 60px; }
        .container { max-width: 1200px; margin: 0 auto; width: 90%; }
        header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid #1e293b; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; box-sizing: border-box; }
        .row { max-width: 1400px; margin: 0 auto; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; font-size: 24px; color: white; letter-spacing: -0.5px; text-decoration: none; }
        .menu { display: flex; gap: 12px; list-style: none; margin: 0; padding: 0; align-items: center; }
        .menu a { color: #cbd5e1; text-decoration: none; font-size: 16px; font-weight: 800; padding: 10px 22px; border-radius: 24px; transition: all 0.25s ease; }
        .menu a:hover { color: white; background: rgba(255, 255, 255, 0.08); }
        .menu a.my-rank-nav-btn { background: linear-gradient(135deg, #ff9500, #ffcc00); color: #0f172a; font-weight: 800; }

        .search-box { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 1px solid #e2e8f0; margin-bottom: 40px; display: flex; gap: 12px; max-width: 1200px; box-sizing: border-box; position: relative; }
        .search-wrapper { position: relative; flex: 1; display: flex; flex-direction: column; }
        .search-input { width: 100%; padding: 16px 24px; border: 2px solid #e2e8f0; border-radius: 14px; font-size: 16px; font-weight: 700; outline: none; transition: border-color 0.2s; box-sizing: border-box; }
        .search-input:focus { border-color: #2563eb; }
        .search-btn { background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; border: none; padding: 0 32px; border-radius: 14px; font-size: 16px; font-weight: 800; cursor: pointer; transition: opacity 0.2s; height: 56px; flex-shrink: 0; }
        .search-btn:hover { opacity: 0.9; }

        .suggestions-list { position: absolute; top: 100%; left: 0; width: 100%; background: white; border: 1px solid #cbd5e1; border-radius: 14px; box-shadow: 0 12px 30px rgba(15,23,42,0.15); z-index: 2000; margin-top: 8px; max-height: 320px; overflow-y: auto; display: none; padding: 0; list-style: none; }
        .suggestions-list li { padding: 10px 16px; font-size: 14px; font-weight: 800; color: #1e293b; cursor: pointer; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #f1f5f9; transition: background 0.15s; }
        .suggestions-list li:last-child { border-bottom: none; }
        .suggestions-list li:hover { background: #eff6ff; color: #2563eb; }
        .suggest-item-img { width: 35px; height: 48px; object-fit: cover; border-radius: 6px; background: #334155; flex-shrink: 0; }
        .suggest-item-title { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }

        .section-title { font-size: 20px; font-weight: 900; color: #0f172a; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }

        /* トレンド */
        .trend-section-wrapper { max-width: 1200px; margin: 0 auto; box-sizing: border-box; }
        .trend-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 50px; width: 100%; }
        .trend-item { background: white; border-radius: 14px; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: all 0.2s ease; overflow: hidden; padding-right: 12px; height: 75px; box-sizing: border-box; position: relative; }
        .trend-item:hover { transform: translateY(-2px); border-color: #3b82f6; box-shadow: 0 6px 15px rgba(59,130,246,0.08); }
        .trend-num { font-size: 13px; font-weight: 900; width: 24px; height: 24px; border-radius: 6px; display: flex; justify-content: center; align-items: center; color: white; flex-shrink: 0; position: absolute; top: 4px; left: 4px; z-index: 5; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .t-rank-1 { background: #ff3b30; }
        .t-rank-2 { background: #ff9500; }
        .t-rank-3 { background: #ffcc00; color: #0f172a; }
        .t-rank-other { background: #64748b; }
        .trend-img-wrapper { width: 55px; height: 100%; flex-shrink: 0; background: #334155; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .trend-anime-img { width: 100%; height: 100%; object-fit: cover; }
        .trend-name { font-size: 12px; font-weight: 800; color: #1e293b; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; word-break: break-all; }
        /* スケルトン */
        .trend-skeleton { background: linear-gradient(90deg, #f1f5f9 25%, #e2e8f0 50%, #f1f5f9 75%); background-size: 400% 100%; animation: shimmer 1.4s infinite; border-radius: 14px; height: 75px; }
        @keyframes shimmer { 0%{background-position:100% 0} 100%{background-position:-100% 0} }

        /* 検索結果 */
        .results-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
        .anime-card { background: white; border-radius: 16px; overflow: hidden; border: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        .anime-img-wrapper { width: 100%; aspect-ratio: 3/4; background: #1e293b; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .anime-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .img-placeholder { color: #64748b; font-weight: 900; font-size: 14px; text-align: center; position: absolute; }
        .card-body { padding: 16px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .anime-title { font-size: 14px; font-weight: 800; margin: 0 0 12px; line-height: 1.4; height: 40px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .episode-select-box { background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 10px; margin-bottom: 12px; }
        .episode-label { font-size: 11px; font-weight: 800; color: #64748b; display: block; margin-bottom: 6px; }
        .episode-input-row { display: flex; align-items: center; gap: 6px; }
        .episode-input { width: 65px; padding: 6px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; font-weight: 700; text-align: center; outline: none; }
        .episode-input:focus { border-color: #3b82f6; }
        .episode-unit { font-size: 12px; font-weight: 800; color: #334155; }
        .btn-add-list { width: 100%; background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; border: none; padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; transition: all 0.2s; }
        .toast { position: fixed; bottom: 24px; right: 24px; background: #0f172a; color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 800; opacity: 0; transform: translateY(10px); pointer-events: none; transition: all 0.3s ease; z-index: 3000; }
        .toast.show { opacity: 1; transform: translateY(0); }

        @media (max-width: 950px) { .trend-grid { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .row { flex-direction: column; gap: 12px; padding: 12px; }
            .logo { font-size: 20px; }
            .menu { flex-wrap: wrap; justify-content: center; gap: 6px; width: 100%; }
            .menu a { font-size: 12px; padding: 6px 14px; }
            main { padding-top: 150px; }
        }
        @media (max-width: 550px) {
            .search-box { flex-direction: column; padding: 16px; gap: 8px; margin-bottom: 24px; }
            .search-btn { width: 100%; height: 48px; }
            .trend-grid { grid-template-columns: 1fr; gap: 10px; margin-bottom: 30px; }
            .results-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
            .card-body { padding: 10px; }
            .anime-title { font-size: 12px; height: 34px; margin-bottom: 8px; }
            .episode-select-box { padding: 6px; margin-bottom: 8px; }
            .episode-input { width: 50px; font-size: 12px; }
            .btn-add-list { padding: 8px; font-size: 11px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="row">
            <a href="./" class="logo">アニ管理</a>
            <nav>
                <ul class="menu">
                    <li><a href="./search.html" style="color:white;background:rgba(255,255,255,0.1);">検索</a></li>
                    <li><a href="./rating.html">評価</a></li>
                    <li><a href="./users/index.html">マイページ</a></li>
                    <li><a href="./my-ranking.html" class="my-rank-nav-btn">🏅 マイランキング</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="search-box">
                <div class="search-wrapper">
                    <input type="text" id="search-keyword" class="search-input" placeholder="作品名を入力すると候補が出ます..." autocomplete="off" oninput="handleSearchSuggestions(this.value)">
                    <ul class="suggestions-list" id="search-suggestions"></ul>
                </div>
                <button class="search-btn" onclick="executeSearch()">検索</button>
            </div>

            <section id="results-section" style="margin-bottom:40px;display:none;">
                <h3 class="section-title" id="results-title">🎯 検索結果</h3>
                <div class="results-grid" id="search-results-list"></div>
            </section>

            <section class="trend-section-wrapper" id="trend-section">
                <h3 class="section-title">📈 ユーザーが今注目しているトレンド作品（TOP 20）</h3>
                <div class="trend-grid" id="trend-keywords-grid">
                    <!-- スケルトンローダー -->
                    <div class="trend-skeleton"></div><div class="trend-skeleton"></div>
                    <div class="trend-skeleton"></div><div class="trend-skeleton"></div>
                    <div class="trend-skeleton"></div><div class="trend-skeleton"></div>
                    <div class="trend-skeleton"></div><div class="trend-skeleton"></div>
                </div>
            </section>
        </div>
    </main>

    <footer style="background-color:#0f172a;color:#94a3b8;padding:40px 20px;text-align:center;font-size:14px;">
        <p style="margin:0 0 12px;">
            <a href="./terms.html" style="color:#94a3b8;text-decoration:none;font-weight:800;">利用規約・プライバシーポリシー</a>
        </p>
        <p style="color:#334155;font-size:12px;margin:0;">&copy; 2026 アニ管理 All Rights Reserved.</p>
    </footer>

    <div class="toast" id="toast-notification" style="font-weight:900;">🌟</div>

    <script>
        const API_BASE_URL = "https://ani-kanri.onrender.com";
        const ANNICT_TOKEN = 'xM12QcwCJtWXmLP3vhZ-ERrDx5wcd5Xr6fl75Klnybk';
        var searchResultsGlobal  = [];
        var suggestDebounceTimer = null;

        window.onload = function() {
            // ★ サーバーのランキングデータを使って本物のトレンドを生成
            generateTrendFromServer();

            document.getElementById('search-keyword').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    document.getElementById('search-suggestions').style.display = 'none';
                    executeSearch();
                }
            });
            document.addEventListener('click', function(e) {
                if (e.target.id !== 'search-keyword') {
                    document.getElementById('search-suggestions').style.display = 'none';
                }
            });
        };

        function getBestAnimeImage(anime) {
            if (!anime || !anime.images) return '';
            return anime.images.recommended_url
                || (anime.images.twitter  && anime.images.twitter.image_url)
                || (anime.images.facebook && anime.images.facebook.og_image_url)
                || '';
        }

        function handleImgError(img, text) {
            img.style.display = 'none';
            var d = document.createElement('div');
            d.className = 'img-placeholder';
            d.style.fontSize = '9px';
            d.innerText = text;
            img.parentNode.appendChild(d);
        }

        // ★ サーバーのランキング + Annictの今期作品を組み合わせてトレンドを生成
        function generateTrendFromServer() {
            var gridContainer = document.getElementById('trend-keywords-grid');

            Promise.all([
                // 1. サーバーのランキング（全ユーザーの評価スコア）
                fetch(API_BASE_URL + '/api/rankings')
                    .then(function(r) { return r.json(); })
                    .catch(function() { return {}; }),
                // 2. Annictの今期人気作品（画像取得のため）
                fetch('https://api.annict.com/v1/works?filter_season=2026-spring&sort_watchers_count=desc&per_page=20&access_token=' + ANNICT_TOKEN)
                    .then(function(r) { return r.json(); })
                    .catch(function() { return { works: [] }; })
            ]).then(function(results) {
                var rankData  = results[0];
                var annictData = results[1];

                // サーバーランキング配列を取り出す
                var serverRankings = [];
                if (Array.isArray(rankData))               serverRankings = rankData;
                else if (Array.isArray(rankData.rankings)) serverRankings = rankData.rankings;
                else if (Array.isArray(rankData.records))  serverRankings = rankData.records;

                // Annictの作品をタイトルとIDで引けるMapにする（画像取得用）
                var annictMap = new Map();
                (annictData.works || []).forEach(function(w) {
                    annictMap.set(String(w.id), w);
                    annictMap.set(w.title, w);
                });

                // ローカルの視聴リスト＋評価
                var localWatched = JSON.parse(localStorage.getItem('watchedAnimes')) || [];
                var localRatings = JSON.parse(localStorage.getItem('animeRatings')) || {};

                var finalTrends = [];

                // ── 優先1: サーバーランキング（全ユーザースコアが高い順）──
                serverRankings
                    .map(function(r) {
                        var id    = String(r.anime_id || r.animeId || r.id || '');
                        var title = r.anime_title || r.animeTitle || r.title || '';
                        var image = r.anime_image || r.animeImage || r.image || '';
                        var score = Number(r.average_score || r.averageScore || r.score || 0);

                        // 画像がなければAnnictから補完
                        if (!image) {
                            var annictWork = annictMap.get(id) || annictMap.get(title);
                            if (annictWork) image = getBestAnimeImage(annictWork);
                        }
                        return { id: id, title: title, img: image, score: score };
                    })
                    .filter(function(item) { return item.title && !item.title.includes('不明') && item.score > 0; })
                    .sort(function(a, b) { return b.score - a.score; })
                    .forEach(function(item) {
                        if (!finalTrends.some(function(t) { return t.title === item.title; })) {
                            finalTrends.push(item);
                        }
                    });

                // ── 優先2: 自分のローカル評価（スコアが高い順）──
                localWatched
                    .map(function(anime) {
                        var r = localRatings[anime.id] || { character:0, art:0, tempo:0, story:0 };
                        var score = (Number(r.character)+Number(r.art)+Number(r.tempo)+Number(r.story)) / 4;
                        var image = anime.image || '';
                        if (!image) {
                            var annictWork = annictMap.get(String(anime.id)) || annictMap.get(anime.title);
                            if (annictWork) image = getBestAnimeImage(annictWork);
                        }
                        return { id: String(anime.id), title: anime.title, img: image, score: score };
                    })
                    .filter(function(item) { return item.title && item.score > 0; })
                    .sort(function(a, b) { return b.score - a.score; })
                    .forEach(function(item) {
                        if (!finalTrends.some(function(t) { return t.title === item.title; })) {
                            finalTrends.push(item);
                        }
                    });

                // ── 優先3: Annictの今期人気作品（画像付き）──
                (annictData.works || []).forEach(function(w) {
                    if (finalTrends.length >= 20) return;
                    if (finalTrends.some(function(t) { return t.title === w.title; })) return;
                    finalTrends.push({ id: String(w.id), title: w.title, img: getBestAnimeImage(w), score: 0 });
                });

                renderTrendGrid(finalTrends.slice(0, 20));
            });
        }

        function renderTrendGrid(trends) {
            var gridContainer = document.getElementById('trend-keywords-grid');
            gridContainer.innerHTML = '';

            if (trends.length === 0) {
                gridContainer.innerHTML = '<p style="color:#64748b;font-weight:bold;">トレンドデータがありません</p>';
                return;
            }

            trends.forEach(function(item, index) {
                var rank = index + 1;
                var rankClass = rank === 1 ? 't-rank-1' : rank === 2 ? 't-rank-2' : rank === 3 ? 't-rank-3' : 't-rank-other';

                // ★ 画像がある場合はimg、ない場合はプレースホルダー
                var imgHTML = item.img
                    ? '<img src="' + item.img + '" class="trend-anime-img" referrerpolicy="no-referrer" onerror="handleImgError(this,\'NO\')">'
                    : '<div style="color:#94a3b8;font-size:9px;font-weight:800;">NO IMAGE</div>';

                gridContainer.insertAdjacentHTML('beforeend',
                    '<div class="trend-item" onclick="clickTrendKeyword(\'' + item.title.replace(/'/g, "\\'") + '\')">' +
                        '<div class="trend-num ' + rankClass + '">' + rank + '</div>' +
                        '<div class="trend-img-wrapper">' + imgHTML + '</div>' +
                        '<div class="trend-name" title="' + item.title + '">' + item.title + '</div>' +
                    '</div>'
                );
            });
        }

        function clickTrendKeyword(keyword) {
            document.getElementById('search-keyword').value = keyword;
            document.getElementById('search-suggestions').style.display = 'none';
            executeSearch();
        }

        function handleSearchSuggestions(value) {
            var suggestionsContainer = document.getElementById('search-suggestions');
            var keyword = value.trim();
            clearTimeout(suggestDebounceTimer);
            if (!keyword) { suggestionsContainer.style.display = 'none'; return; }

            suggestDebounceTimer = setTimeout(function() {
                fetch('https://api.annict.com/v1/works?filter_title=' + encodeURIComponent(keyword) + '&per_page=5&sort_watchers_count=desc&access_token=' + ANNICT_TOKEN)
                    .then(function(r) { return r.json(); })
                    .then(function(data) {
                        var works = data.works || [];
                        if (works.length === 0) { suggestionsContainer.style.display = 'none'; return; }
                        suggestionsContainer.innerHTML = '';
                        works.forEach(function(anime) {
                            var imgUrl = getBestAnimeImage(anime);
                            var imgHTML = imgUrl
                                ? '<img src="' + imgUrl + '" class="suggest-item-img" referrerpolicy="no-referrer" onerror="this.style.display=\'none\'">'
                                : '<div class="suggest-item-img" style="display:flex;justify-content:center;align-items:center;color:#64748b;font-size:8px;font-weight:bold;">NO</div>';
                            var li = document.createElement('li');
                            li.innerHTML = imgHTML + '<div class="suggest-item-title">' + anime.title + '</div>';
                            li.onclick = function() {
                                document.getElementById('search-keyword').value = anime.title;
                                suggestionsContainer.style.display = 'none';
                                executeSearch();
                            };
                            suggestionsContainer.appendChild(li);
                        });
                        suggestionsContainer.style.display = 'block';
                    })
                    .catch(function() { suggestionsContainer.style.display = 'none'; });
            }, 250);
        }

        function executeSearch() {
            var keyword = document.getElementById('search-keyword').value.trim();
            if (!keyword) return;
            var resultsSection   = document.getElementById('results-section');
            var resultsContainer = document.getElementById('search-results-list');
            resultsSection.style.display = 'block';
            resultsContainer.innerHTML = '<p style="color:#64748b;font-weight:bold;grid-column:1/-1;text-align:center;padding:20px 0;">検索中...</p>';

            fetch('https://api.annict.com/v1/works?filter_title=' + encodeURIComponent(keyword) + '&sort_watchers_count=desc&per_page=20&access_token=' + ANNICT_TOKEN)
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var works = data.works || [];
                    searchResultsGlobal = works;
                    if (works.length === 0) {
                        resultsContainer.innerHTML = '<p style="color:#64748b;font-weight:bold;grid-column:1/-1;text-align:center;padding:20px 0;">一致するアニメが見つかりませんでした。</p>';
                        return;
                    }
                    var watchedList = JSON.parse(localStorage.getItem('watchedAnimes')) || [];
                    var savedIds = watchedList.map(function(w) { return String(w.id); });
                    resultsContainer.innerHTML = '';
                    works.forEach(function(anime) {
                        var imageUrl  = getBestAnimeImage(anime);
                        var imageHTML = imageUrl
                            ? '<div class="anime-img-wrapper"><img src="' + imageUrl + '" class="anime-img" referrerpolicy="no-referrer" onerror="handleImgError(this,\'NO IMAGE\')"></div>'
                            : '<div class="anime-img-wrapper"><div class="img-placeholder">NO IMAGE</div></div>';
                        var existingRecord = watchedList.find(function(w) { return String(w.id) === String(anime.id); });
                        var defaultEp = existingRecord && existingRecord.current_episode ? existingRecord.current_episode : 1;
                        var isAdded = savedIds.includes(String(anime.id));
                        var episodeFormHTML =
                            '<div class="episode-select-box">' +
                                '<label class="episode-label">🍿 視聴ステータス入力</label>' +
                                '<div class="episode-input-row">' +
                                    '<input type="number" min="0" value="' + defaultEp + '" id="ep-input-' + anime.id + '" class="episode-input">' +
                                    '<span class="episode-unit">話まで見た</span>' +
                                '</div>' +
                            '</div>';
                        var buttonHTML = isAdded
                            ? '<button class="btn-add-list" style="background:#475569;" id="btn-' + anime.id + '" onclick="addFromSearch(\'' + anime.id + '\')">🔄 話数を更新して保存</button>'
                            : '<button class="btn-add-list" id="btn-' + anime.id + '" onclick="addFromSearch(\'' + anime.id + '\')">➕ マイページに保存</button>';
                        resultsContainer.insertAdjacentHTML('beforeend',
                            '<div class="anime-card">' +
                                imageHTML +
                                '<div class="card-body">' +
                                    '<p class="anime-title" title="' + anime.title + '">' + anime.title + '</p>' +
                                    episodeFormHTML +
                                    buttonHTML +
                                '</div>' +
                            '</div>'
                        );
                    });
                })
                .catch(function() {
                    resultsContainer.innerHTML = '<p style="color:#ef4444;font-weight:bold;grid-column:1/-1;text-align:center;padding:20px 0;">データの検索に失敗しました。</p>';
                });
        }

        function addFromSearch(animeId) {
            var anime = searchResultsGlobal.find(function(item) { return String(item.id) === String(animeId); });
            if (!anime) return;

            var epInput = document.getElementById('ep-input-' + animeId);
            var inputEpisodeValue = epInput ? parseInt(epInput.value, 10) || 0 : 0;
            var episodeStr = inputEpisodeValue === 0 ? '全話' : inputEpisodeValue + '話';
            var imageUrl = getBestAnimeImage(anime);

            var watchedList   = JSON.parse(localStorage.getItem('watchedAnimes')) || [];
            var existingIndex = watchedList.findIndex(function(w) { return String(w.id) === String(animeId); });

            var targetItem = {
                id:             String(anime.id),
                title:          anime.title,
                title_kana:     anime.title_kana || '',
                media_name:     anime.media_name || 'tv',
                episodes_count: anime.episodes_count || 12,
                image:          imageUrl,
                season_name:    anime.season_name || '2026-spring',
                current_episode: inputEpisodeValue
            };

            if (existingIndex !== -1) { watchedList[existingIndex] = targetItem; }
            else { watchedList.push(targetItem); }
            localStorage.setItem('watchedAnimes', JSON.stringify(watchedList));

            var savedEpisodes = JSON.parse(localStorage.getItem('animeEpisodes')) || {};
            savedEpisodes[anime.title] = episodeStr;
            localStorage.setItem('animeEpisodes', JSON.stringify(savedEpisodes));

            var googleId = localStorage.getItem('googleId');
            if (googleId) {
                fetch(API_BASE_URL + '/api/records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        googleId:      googleId,
                        animeId:       String(anime.id),
                        anime_id:      String(anime.id),
                        animeTitle:    anime.title,
                        anime_title:   anime.title,
                        animeImage:    imageUrl,
                        anime_image:   imageUrl,
                        seasonName:    anime.season_name || '2026-spring',
                        season_name:   anime.season_name || '2026-spring',
                        mediaName:     anime.media_name || 'tv',
                        episodesCount: anime.episodes_count || 12,
                        episode:       episodeStr
                    })
                })
                .then(function(r) { return r.json(); })
                .then(function(d) { console.log('[サーバー保存]', d); })
                .catch(function(e) { console.error('[サーバー保存エラー]', e); });
            }

            var btn = document.getElementById('btn-' + animeId);
            if (btn) {
                btn.style.background = '#10b981';
                btn.innerText = '✅ 保存完了 (' + inputEpisodeValue + '話)';
                setTimeout(function() { btn.style.background = '#475569'; btn.innerText = '🔄 話数を更新して保存'; }, 2000);
            }

            var toast = document.getElementById('toast-notification');
            toast.innerText = '🌟「' + anime.title + '」を ' + inputEpisodeValue + '話まで見た状態で保存しました！';
            toast.classList.add('show');
            setTimeout(function() { toast.classList.remove('show'); }, 3000);

            // トレンドを再生成（ローカルが更新されたので）
            generateTrendFromServer();
        }
    </script>
</body>
</html>
