<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>作品評価 - アニ管理</title>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; overflow-x: hidden; width: 100%; }
        body { display: flex; flex-direction: column; font-family: 'Noto Sans JP', sans-serif; background-color: #f4f6f9; color: #333; }
        main { flex: 1; padding: 120px 0 60px; width: 100%; box-sizing: border-box; }
        .container { max-width: 1000px; margin: 0 auto; width: 90%; box-sizing: border-box; }
        header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid #1e293b; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; box-sizing: border-box; }
        .row { max-width: 1400px; margin: 0 auto; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; box-sizing: border-box; }
        .logo { font-weight: 900; font-size: 24px; color: white; letter-spacing: -0.5px; text-decoration: none; flex-shrink: 0; }
        .menu { display: flex; gap: 12px; list-style: none; margin: 0; padding: 0; align-items: center; }
        .menu a { color: #cbd5e1; text-decoration: none; font-size: 16px; font-weight: 800; padding: 10px 22px; border-radius: 24px; transition: all 0.25s ease; white-space: nowrap; }
        .menu a:hover { color: white; background: rgba(255, 255, 255, 0.08); }
        .menu a.my-rank-nav-btn { background: linear-gradient(135deg, #ff9500, #ffcc00); color: #0f172a; font-weight: 800; }
        .page-header-box { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; flex-wrap: wrap; gap: 20px; width: 100%; box-sizing: border-box; }
        .page-title { font-size: 28px; font-weight: 800; border-left: 6px solid #ff3b30; padding-left: 15px; color: #0f172a; margin: 0; }
        .my-search-box { padding: 10px 18px; font-size: 14px; border: 2px solid #e2e8f0; border-radius: 20px; outline: none; width: 100%; max-width: 300px; transition: 0.2s; box-sizing: border-box; }
        .my-search-box:focus { border-color: #ff3b30; background: white; }
        .rating-layout { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; width: 100%; box-sizing: border-box; }
        .rating-card { background: white; border-radius: 20px; padding: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; display: flex; flex-direction: row; gap: 20px; transition: all 0.2s; position: relative; box-sizing: border-box; width: 100%; min-width: 0; }
        .thumb-wrapper { width: 110px; aspect-ratio: 3/4; flex-shrink: 0; position: relative; background: #cbd5e1; border-radius: 12px; overflow: hidden; }
        .anime-thumb { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block; }
        .no-image-placeholder { width: 100%; height: 100%; background: #cbd5e1; display: flex; justify-content: center; align-items: center; font-size: 11px; color: #475569; font-weight: bold; text-align: center; border-radius: 12px; position: absolute; top: 0; left: 0; box-sizing: border-box; padding: 4px; }
        .rating-info { flex: 1; display: flex; flex-direction: column; min-width: 0; width: 100%; }
        .anime-title { font-weight: 800; font-size: 16px; margin: 0 0 15px 0; color: #0f172a; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rating-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; width: 100%; box-sizing: border-box; }
        .rating-label { font-size: 13px; font-weight: 700; color: #475569; flex-shrink: 0; white-space: nowrap; }
        .stars-container { display: flex; gap: 4px; flex-shrink: 0; justify-content: flex-end; }
        .star { font-size: 20px; color: #cbd5e1; cursor: pointer; transition: transform 0.1s, color 0.1s; user-select: none; flex-shrink: 0; width: 20px; text-align: center; display: inline-block; }
        .star.active { color: #ffcc00; }
        .star.hover-active { color: #ffe066; }
        .comment-box { width: 100%; min-height: 60px; margin-top: 12px; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical; box-sizing: border-box; outline: none; transition: 0.2s; background: #f8fafc; }
        .comment-box:focus { border-color: #ff3b30; background: white; }
        .total-score-box { margin-top: 15px; padding-top: 12px; border-top: 1px dashed #e2e8f0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; width: 100%; box-sizing: border-box; }
        .total-stars { font-size: 14px; color: #ffcc00; font-weight: bold; background: #0f172a; padding: 6px 12px; border-radius: 12px; white-space: nowrap; }
        .btn-save-rating { padding: 10px 20px; border: none; border-radius: 20px; background: linear-gradient(135deg, #ff3b30, #ff2d55); color: white; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 10px rgba(255,59,48,0.2); transition: all 0.2s; white-space: nowrap; }
        .btn-save-rating:hover { transform: translateY(-2px); }
        .btn-save-rating.saved { background: #059669; }
        @media (max-width: 768px) {
            main { padding-top: 135px; }
            .row { flex-direction: column; gap: 10px; padding: 10px; align-items: center; }
            .menu { gap: 4px; width: 100%; justify-content: center; }
            .menu a { font-size: 12px; padding: 6px 10px; }
            .rating-layout { grid-template-columns: 1fr; gap: 16px; }
            .rating-card { flex-direction: column; padding: 16px; gap: 16px; align-items: center; }
            .thumb-wrapper { width: 140px; }
            .anime-title { font-size: 15px; text-align: center; white-space: normal; overflow: visible; }
            .star { font-size: 18px; width: 18px; }
            .btn-save-rating { width: 100%; box-sizing: border-box; padding: 12px; }
        }
    </style>
</head>
<body>
    <header>
        <div class="row">
            <a href="./" class="logo">アニ管理</a>
            <nav>
                <ul class="menu">
                    <li><a href="./search.html">検索</a></li>
                    <li><a href="./rating.html" style="color:white;background:rgba(255,255,255,0.1);">評価</a></li>
                    <li><a href="./users/index.html">マイページ</a></li>
                    <li><a href="./my-ranking.html" class="my-rank-nav-btn">🏅 マイRank</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-header-box">
                <div>
                    <h2 class="page-title">⭐ 作品評価・感想</h2>
                    <p id="sync-status-text" style="color:#64748b;margin:5px 0 0;font-size:13px;">星と感想を入力後、「保存する」ボタンを押して確定してください。</p>
                </div>
                <input type="text" id="my-rating-search" class="my-search-box" placeholder="自分のリストから作品を検索...">
            </div>
            <div class="rating-layout" id="rating-grid"></div>
        </div>
    </main>

    <script>
        const API_BASE_URL = "https://ani-kanri.onrender.com";
        const ratingGrid    = document.getElementById('rating-grid');
        const myRatingSearch = document.getElementById('my-rating-search');
        const axes   = ['character', 'art', 'tempo', 'story'];
        const axesJa = { character: 'キャラ性', art: '作画', tempo: 'テンポ', story: 'ストーリー' };

        let watchedList  = [];
        let tempRatings  = {};

        window.onload = function() {
            loadCloudRatingsBeforeRender();
            myRatingSearch.addEventListener('input', function() {
                var query = myRatingSearch.value.toLowerCase().trim();
                watchedList.forEach(function(anime) {
                    var card = document.getElementById('card-' + anime.id);
                    if (!card) return;
                    card.style.display = anime.title.toLowerCase().includes(query) ? '' : 'none';
                });
            });
        };

        // ── サーバーから評価を取得してローカルへ反映 ──
        function loadCloudRatingsBeforeRender() {
            var googleId   = localStorage.getItem('googleId');
            var statusText = document.getElementById('sync-status-text');

            if (!googleId) {
                statusText.innerText = "💡 ゲストモード：データはブラウザに一時保存されます。";
                loadRatingPage();
                return;
            }

            statusText.innerText = "🔄 サーバーから最新の評価データを同期中...";

            fetch(API_BASE_URL + '/api/ratings/' + googleId)
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    if (data.status === 'success' && Array.isArray(data.ratings)) {
                        var localRatings = JSON.parse(localStorage.getItem('animeRatings')) || {};
                        var localWatched = JSON.parse(localStorage.getItem('watchedAnimes')) || [];
                        var changed = false;

                        data.ratings.forEach(function(r) {
                            // ★ キー名のブレを両方吸収
                            var animeId    = String(r.anime_id || r.animeId || r.id || '');
                            var animeTitle = r.anime_title || r.animeTitle || r.title || '';
                            var animeImage = r.anime_image || r.animeImage || r.image || '';
                            var seasonName = r.season_name || r.seasonName || '2026-spring';

                            if (!animeId || !animeTitle || animeTitle.includes('不明')) return;

                            var c = Number(r.character || 0), a = Number(r.art || 0),
                                t = Number(r.tempo || 0),     s = Number(r.story || 0);

                            localRatings[animeId] = {
                                character: c, art: a, tempo: t, story: s,
                                total: Number(((c+a+t+s)/4).toFixed(1)),
                                comment: r.comment || ''
                            };

                            if (!localWatched.some(function(w) { return String(w.id) === animeId; })) {
                                localWatched.push({ id: animeId, title: animeTitle, image: animeImage, season_name: seasonName });
                                changed = true;
                            }
                        });

                        localStorage.setItem('animeRatings', JSON.stringify(localRatings));
                        if (changed) {
                            localWatched = localWatched.filter(function(w) { return w.title && !w.title.includes('不明'); });
                            localStorage.setItem('watchedAnimes', JSON.stringify(localWatched));
                        }
                        statusText.innerHTML = "🟢 同期完了";
                    }
                    loadRatingPage();
                })
                .catch(function(err) {
                    console.error('評価データ同期失敗:', err);
                    statusText.innerHTML = "⚠️ オフライン（ローカルデータで動作中）";
                    loadRatingPage();
                });
        }

        function loadRatingPage() {
            var rawWatched = JSON.parse(localStorage.getItem('watchedAnimes')) || [];
            watchedList = rawWatched.filter(function(w) { return w.title && !w.title.includes('不明'); });
            var ratings = JSON.parse(localStorage.getItem('animeRatings')) || {};

            if (watchedList.length === 0) {
                ratingGrid.innerHTML = '<p style="color:#64748b;font-weight:bold;grid-column:1/-1;text-align:center;padding:40px 0;">評価できるアニメがまだありません。</p>';
                return;
            }

            ratingGrid.innerHTML = '';
            watchedList.forEach(function(anime) {
                var imageHTML = anime.image && anime.image.trim()
                    ? '<div class="thumb-wrapper"><img src="' + anime.image + '" class="anime-thumb" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'"><div class="no-image-placeholder" style="display:none">NO IMAGE</div></div>'
                    : '<div class="thumb-wrapper"><div class="no-image-placeholder">NO IMAGE</div></div>';

                var animeRate = ratings[anime.id] || { character:0, art:0, tempo:0, story:0, comment:'' };
                tempRatings[anime.id] = Object.assign({}, animeRate);

                var total = ((Number(animeRate.character||0)+Number(animeRate.art||0)+Number(animeRate.tempo||0)+Number(animeRate.story||0))/4).toFixed(1);

                var rowsHTML = '';
                axes.forEach(function(axis) {
                    var starsHTML = '';
                    for (var i = 1; i <= 5; i++) {
                        starsHTML += '<span class="star ' + (i <= (animeRate[axis]||0) ? 'active' : '') + '" data-anime="' + anime.id + '" data-axis="' + axis + '" data-value="' + i + '">★</span>';
                    }
                    rowsHTML += '<div class="rating-row"><span class="rating-label">' + axesJa[axis] + '</span><div class="stars-container">' + starsHTML + '</div></div>';
                });

                ratingGrid.insertAdjacentHTML('beforeend',
                    '<div class="rating-card" id="card-' + anime.id + '">' +
                        imageHTML +
                        '<div class="rating-info">' +
                            '<p class="anime-title" title="' + anime.title + '">' + anime.title + '</p>' +
                            rowsHTML +
                            '<textarea class="comment-box" id="comment-' + anime.id + '" placeholder="作品の感想やメモを自由に書けます...">' + (animeRate.comment||'') + '</textarea>' +
                            '<div class="total-score-box">' +
                                '<div class="total-stars" id="total-val-' + anime.id + '">⭐ 総合: ' + total + '</div>' +
                                '<button class="btn-save-rating" id="save-btn-' + anime.id + '" data-anime="' + anime.id + '">保存する</button>' +
                            '</div>' +
                        '</div>' +
                    '</div>'
                );
            });

            // 星のインタラクション
            document.querySelectorAll('.stars-container').forEach(function(container) {
                var stars = container.querySelectorAll('.star');
                stars.forEach(function(star) {
                    star.addEventListener('click', function(e) {
                        changeTempRating(e.currentTarget.dataset.anime, e.currentTarget.dataset.axis, parseInt(e.currentTarget.dataset.value));
                    });
                    star.addEventListener('mouseenter', function(e) {
                        var val = parseInt(e.currentTarget.dataset.value);
                        stars.forEach(function(s) {
                            s.classList.toggle('hover-active', parseInt(s.dataset.value) <= val);
                        });
                    });
                });
                container.addEventListener('mouseleave', function() {
                    stars.forEach(function(s) { s.classList.remove('hover-active'); });
                });
            });

            document.querySelectorAll('.btn-save-rating').forEach(function(btn) {
                btn.addEventListener('click', function(e) { commitRating(e.currentTarget.dataset.anime); });
            });
        }

        function changeTempRating(animeId, axis, value) {
            var temp = tempRatings[animeId];
            temp[axis] = (temp[axis] === value) ? 0 : value;

            var card  = document.getElementById('card-' + animeId);
            card.querySelectorAll('.star[data-axis="' + axis + '"]').forEach(function(s) {
                s.classList.toggle('active', parseInt(s.dataset.value) <= temp[axis]);
            });

            var newTotal = ((Number(temp.character)+Number(temp.art)+Number(temp.tempo)+Number(temp.story))/4).toFixed(1);
            document.getElementById('total-val-' + animeId).textContent = '⭐ 総合: ' + newTotal;

            var btn = document.getElementById('save-btn-' + animeId);
            btn.textContent = "変更を保存する";
            btn.classList.remove('saved');
        }

        function commitRating(animeId) {
            var ratings    = JSON.parse(localStorage.getItem('animeRatings')) || {};
            var comment    = (document.getElementById('comment-' + animeId) || {}).value || '';
            var animeInfo  = watchedList.find(function(w) { return String(w.id) === String(animeId); });
            if (!animeInfo || animeInfo.title.includes('不明')) return;

            var c = Number(tempRatings[animeId].character||0), a = Number(tempRatings[animeId].art||0),
                t = Number(tempRatings[animeId].tempo||0),     s = Number(tempRatings[animeId].story||0);
            var total = Number(((c+a+t+s)/4).toFixed(1));

            ratings[animeId] = { character:c, art:a, tempo:t, story:s, total:total, comment:comment };
            localStorage.setItem('animeRatings', JSON.stringify(ratings));

            var saveBtn = document.getElementById('save-btn-' + animeId);
            if (saveBtn) { saveBtn.textContent = "⏳ 同期中..."; saveBtn.style.pointerEvents = "none"; }

            var googleId = localStorage.getItem('googleId');
            if (!googleId) { showSavedStyle(saveBtn); return; }

            // ★ キー名をサーバーの期待する形式に統一（snake_case）
            var payload = {
                googleId:    googleId,
                animeId:     String(animeId),
                anime_id:    String(animeId),
                animeTitle:  animeInfo.title,
                anime_title: animeInfo.title,
                animeImage:  animeInfo.image || '',
                anime_image: animeInfo.image || '',
                season_name: animeInfo.season_name || '2026-spring',
                character:   c, art: a, tempo: t, story: s,
                comment:     comment,
                episode:     1
            };

            console.log('[評価保存] ペイロード:', payload);

            // 評価を保存
            fetch(API_BASE_URL + '/api/ratings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(function(res) {
                if (!res.ok) throw new Error('ratings API エラー: ' + res.status);
                return res.json();
            })
            .then(function(data) {
                console.log('[評価保存] レスポンス:', data);
                // 視聴記録にも同期
                return fetch(API_BASE_URL + '/api/records', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                console.log('[records同期] レスポンス:', data);
                showSavedStyle(saveBtn);
            })
            .catch(function(err) {
                console.error('[評価保存エラー]', err);
                if (saveBtn) { saveBtn.textContent = "⚠️ ローカルのみ保存"; saveBtn.style.pointerEvents = "auto"; }
            });
        }

        function showSavedStyle(btn) {
            if (!btn) return;
            btn.style.pointerEvents = "auto";
            btn.textContent = "✓ 保存されました";
            btn.classList.add('saved');
            setTimeout(function() {
                if (btn.classList.contains('saved')) btn.textContent = "保存する";
            }, 2000);
        }
    </script>
</body>
</html>
