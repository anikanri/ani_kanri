<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <title>作品評価 - アニ管理</title>
    <style>
        /* 🌐 画面全体の横揺れ（はみ出し）を絶対に防ぐ */
        html, body { 
            height: 100%; 
            margin: 0; 
            padding: 0;
            overflow-x: hidden; 
            width: 100%;
        }
        body { 
            display: flex; 
            flex-direction: column; 
            font-family: 'Noto Sans JP', sans-serif; 
            background-color: #f4f6f9; 
            color: #333; 
        }
        main { flex: 1; padding: 120px 0 60px; width: 100%; box-sizing: border-box; }
        .container { max-width: 1000px; margin: 0 auto; width: 90%; box-sizing: border-box; }
        
        /* 💻 統一ヘッダー */
        header { 
            background: rgba(15, 23, 42, 0.9); 
            backdrop-filter: blur(8px); 
            border-bottom: 1px solid #1e293b; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            z-index: 1000; 
            box-sizing: border-box; 
        }
        .row { 
            max-width: 1400px; 
            margin: 0 auto; 
            padding: 15px 20px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-sizing: border-box; 
        }
        .logo { font-weight: 900; font-size: 24px; color: white; letter-spacing: -0.5px; text-decoration: none; flex-shrink: 0; }
        .menu { display: flex; gap: 12px; list-style: none; margin: 0; padding: 0; align-items: center; }
        .menu a { color: #cbd5e1; text-decoration: none; font-size: 16px; font-weight: 800; padding: 10px 22px; border-radius: 24px; transition: all 0.25s ease; letter-spacing: 0.5px; white-space: nowrap; }
        .menu a:hover { color: white; background: rgba(255, 255, 255, 0.08); }
        .menu a.active { color: white; background: linear-gradient(135deg, #ff3b30, #ff2d55); box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3); }
        .menu a.my-rank-nav-btn { background: linear-gradient(135deg, #ff9500, #ffcc00); color: #0f172a; box-shadow: 0 4px 10px rgba(255,149,0,0.2); font-weight: 800; }

        .page-header-box { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; flex-wrap: wrap; gap: 20px; width: 100%; box-sizing: border-box; }
        .page-title { font-size: 28px; font-weight: 800; border-left: 6px solid #ff3b30; padding-left: 15px; color: #0f172a; margin: 0; }
        
        .my-search-box { padding: 10px 18px; font-size: 14px; border: 2px solid #e2e8f0; border-radius: 20px; outline: none; width: 100%; max-width: 300px; transition: 0.2s; box-sizing: border-box; }
        .my-search-box:focus { border-color: #ff3b30; background: white; }

        /* 🎬 レイアウト */
        .rating-layout { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); 
            gap: 24px; 
            width: 100%;
            box-sizing: border-box;
        }
        .rating-card { 
            background: white; 
            border-radius: 20px; 
            padding: 24px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.05); 
            border: 1px solid #e2e8f0; 
            display: flex; 
            flex-direction: row; 
            gap: 20px; 
            transition: all 0.2s; 
            position: relative; 
            box-sizing: border-box; 
            width: 100%; 
            min-width: 0; 
        }
        
        /* 🖼️ 画像表示・NO IMAGE表示 */
        .thumb-wrapper { width: 110px; aspect-ratio: 3/4; flex-shrink: 0; position: relative; background: #cbd5e1; border-radius: 12px; overflow: hidden; }
        .anime-thumb { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; display: block; }
        .no-image-placeholder { width: 100%; height: 100%; background: #cbd5e1; display: flex; justify-content: center; align-items: center; font-size: 11px; color: #475569; font-weight: bold; text-align: center; border-radius: 12px; position: absolute; top: 0; left: 0; box-sizing: border-box; padding: 4px; }

        .rating-info { flex: 1; display: flex; flex-direction: column; min-width: 0; width: 100%; }
        .anime-title { font-weight: 800; font-size: 16px; margin: 0 0 15px 0; color: #0f172a; line-height: 1.4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        /* ⭐ 星評価の行 */
        .rating-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 8px; width: 100%; box-sizing: border-box; }
        .rating-label { font-size: 13px; font-weight: 700; color: #475569; flex-shrink: 0; white-space: nowrap; }
        
        .stars-container { display: flex; gap: 4px; direction: ltr; flex-shrink: 0; justify-content: flex-end; }
        .star { font-size: 20px; color: #cbd5e1; cursor: pointer; transition: transform 0.1s, color 0.1s; user-select: none; flex-shrink: 0; width: 20px; text-align: center; display: inline-block; }
        .star.active { color: #ffcc00; }
        .star.hover-active { color: #ffe066; }

        .comment-box { width: 100%; min-height: 60px; margin-top: 12px; padding: 10px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 13px; font-family: inherit; resize: vertical; box-sizing: border-box; outline: none; transition: 0.2s; background: #f8fafc; }
        .comment-box:focus { border-color: #ff3b30; background: white; }

        .total-score-box { margin-top: 15px; padding-top: 12px; border-top: 1px dashed #e2e8f0; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; width: 100%; box-sizing: border-box; }
        .total-stars { font-size: 14px; color: #ffcc00; font-weight: bold; background: #0f172a; padding: 6px 12px; border-radius: 12px; white-space: nowrap; }
        
        .btn-save-rating { padding: 10px 20px; border: none; border-radius: 20px; background: linear-gradient(135deg, #ff3b30, #ff2d55); color: white; font-weight: bold; font-size: 13px; cursor: pointer; box-shadow: 0 4px 10px rgba(255,59,48,0.2); transition: all 0.2s; text-align: center; white-space: nowrap; }
        .btn-save-rating:hover { transform: translateY(-2px); box-shadow: 0 6px 15px rgba(255,59,48,0.35); }
        .btn-save-rating.saved { background: #059669; box-shadow: 0 4px 10px rgba(5,150,105,0.2); }

        /* 📱 スマホ・タブレット用レスポンシブ */
        @media (max-width: 768px) {
            main { padding-top: 135px; } 
            .container { width: 92%; } 
            
            .row { 
                flex-direction: column; 
                gap: 10px; 
                padding: 10px 10px 12px; 
                align-items: center;
            }
            .logo { font-size: 20px; }
            .menu { gap: 4px; width: 100%; justify-content: center; }
            .menu a { font-size: 12px; padding: 6px 10px; letter-spacing: 0px; }
            
            .page-header-box { gap: 10px; margin-bottom: 20px; }
            .page-title { font-size: 22px; }
            .my-search-box { max-width: 100%; } 

            .rating-layout { grid-template-columns: 1fr; gap: 16px; }
            .rating-card { flex-direction: column; padding: 16px; gap: 16px; align-items: center; }
            
            .thumb-wrapper { width: 140px; }
            .anime-title { font-size: 15px; margin-bottom: 12px; text-align: center; white-space: normal; overflow: visible; text-overflow: clip; }
            
            .rating-row { margin-bottom: 6px; gap: 8px; }
            .rating-label { font-size: 13px; }
            .star { font-size: 18px; width: 18px; }
            
            .comment-box { margin-top: 10px; font-size: 13px; }
            .total-score-box { justify-content: space-between; width: 100%; margin-top: 12px; padding-top: 12px; }
            .total-stars { font-size: 13px; padding: 5px 12px; }
            .btn-save-rating { width: 100%; box-sizing: border-box; font-size: 13px; padding: 12px; } 
        }

        /* 🚨 超極小スマホ用 */
        @media (max-width: 375px) {
            main { padding-top: 130px; }
            .row { padding: 8px 5px 10px; gap: 8px; }
            .menu a { padding: 5px 7px; font-size: 11px; }
            .rating-card { padding: 12px; gap: 12px; }
            .thumb-wrapper { width: 110px; }
            .star { font-size: 16px; width: 16px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="row"> 
            <a href="./" class="logo">アニ管理</a>
            <nav>
                <ul class="menu">      
                    <li><a href="./search.html">検索</a></li>
                    <li><a href="./rating.html" style="color: white; background: rgba(255,255,255,0.1);">評価</a></li>
                    <li><a href="./users/index.html">マイページ</a></li>
                    <li><a href="./my-ranking.html" class="my-rank-nav-btn">🏅 マイRank</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="page-header-box">
                <div>
                    <h2 class="page-title">⭐ 作品評価・感想</h2>
                    <p id="sync-status-text" style="color: #64748b; margin: 5px 0 0 0; font-size: 13px;">星と感想を入力後、右下の「保存する」ボタンを押して確定してください。</p>
                </div>
                <input type="text" id="my-rating-search" class="my-search-box" placeholder="自分のリストから作品を検索...">
            </div>
            
            <div class="rating-layout" id="rating-grid"></div>
        </div>
    </main>

    <script>
      const API_BASE_URL = "https://ani-kanri.onrender.com";

        const ratingGrid = document.getElementById('rating-grid');
        const myRatingSearch = document.getElementById('my-rating-search');
        const axes = ['character', 'art', 'tempo', 'story'];
        const axesJa = { character: 'キャラ性', art: '作画', tempo: 'テンポ', story: 'ストーリー' }; 

        let watchedList = [];
        let tempRatings = {};

        window.onload = function() {
            loadCloudRatingsBeforeRender();
            
            myRatingSearch.addEventListener('input', () => {
                const query = myRatingSearch.value.toLowerCase().trim();
                watchedList.forEach(anime => {
                    const card = document.getElementById(`card-${anime.id}`);
                    if (!card) return;
                    if (anime.title.toLowerCase().includes(query)) {
                        card.style.display = '';
                    } else {
                        card.style.setProperty('display', 'none', 'important');
                    }
                });
            });
        };

        function loadCloudRatingsBeforeRender() {
            const googleId = localStorage.getItem('googleId');
            const statusText = document.getElementById('sync-status-text');

            if (googleId) {
                statusText.innerText = "🔄 サーバーから最新の評価データを同期中...";
                fetch(`${API_BASE_URL}/api/ratings/${googleId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success' && data.ratings) {
                        let localRatings = JSON.parse(localStorage.getItem('animeRatings')) || {};
                        let localWatched = JSON.parse(localStorage.getItem('watchedAnimes')) || [];
                        let isNewAnimeAdded = false;

                        data.ratings.forEach(r => {
                            // 🛑【重要】タイトルが「不明」または空文字のデータは、処理を完全にスキップ（除外）
                            const animeTitle = r.title || r.animeTitle || '不明な作品';
                            if (!r.anime_id || animeTitle.includes('不明') || animeTitle.trim() === '') {
                                return; 
                            }

                            const charVal = Number(r.character || 0);
                            const artVal = Number(r.art || 0);
                            const tempoVal = Number(r.tempo || 0);
                            const storyVal = Number(r.story || 0);
                            const totalCalc = ((charVal + artVal + tempoVal + storyVal) / 4).toFixed(1);

                            const targetImage = r.image || r.animeImage || '';

                            localRatings[r.anime_id] = {
                                character: charVal,
                                art: artVal,
                                tempo: tempoVal,
                                story: storyVal,
                                total: Number(totalCalc),
                                comment: r.comment || ''
                            };

                            const animeIdStr = String(r.anime_id);
                            const alreadyInWatched = localWatched.some(item => String(item.id) === animeIdStr);

                            if (!alreadyInWatched) {
                                const seasonName = r.season_name || r.seasonName || '2026-spring';

                                localWatched.push({
                                    id: animeIdStr,
                                    title: animeTitle,
                                    image: targetImage,
                                    season_name: seasonName
                                });
                                isNewAnimeAdded = true;

                                const syncPayload = {
                                    googleId: googleId,
                                    animeId: animeIdStr,
                                    anime_id: animeIdStr,
                                    title: animeTitle,
                                    image: targetImage,
                                    season_name: seasonName,
                                    episode: 1
                                };

                                // クリーンなデータ（判明している作品）のみサーバーへPOST同期する
                                fetch(`${API_BASE_URL}/api/records`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify(syncPayload)
                                }).catch(e => console.error("バックグラウンド同期失敗:", e));
                            } else {
                                const idx = localWatched.findIndex(item => String(item.id) === animeIdStr);
                                if (idx !== -1 && (!localWatched[idx].image || localWatched[idx].image.trim() === '')) {
                                    localWatched[idx].image = targetImage;
                                    isNewAnimeAdded = true;
                                }
                            }
                        });

                        localStorage.setItem('animeRatings', JSON.stringify(localRatings));
                        if (isNewAnimeAdded) {
                            // 🛑【重要】ローカルストレージに保存する前に、念のため「不明」な残骸が混ざっていたら除去
                            localWatched = localWatched.filter(item => item.title && !item.title.includes('不明'));
                            localStorage.setItem('watchedAnimes', JSON.stringify(localWatched));
                        }

                        statusText.innerHTML = "🟢 サーバーとの同期・マイページへのデータ復旧が完了しました！";
                    }
                    loadRatingPage();
                })
                .catch(err => {
                    console.error('評価データの同期失敗:', err);
                    statusText.innerHTML = "⚠️ サーバーデータ同期オフライン（ローカルデータで動作中）";
                    loadRatingPage();
                });
            } else {
                statusText.innerHTML = "💡 ゲストモード：データはブラウザに一時保存されます。";
                loadRatingPage();
            }
        }
        
        function loadRatingPage() {
            // 🛑【重要】読み込み時に「不明」な作品を除外してクリーンにする
            let rawWatched = JSON.parse(localStorage.getItem('watchedAnimes')) || [];
            watchedList = rawWatched.filter(item => item.title && !item.title.includes('不明'));
            
            const ratings = JSON.parse(localStorage.getItem('animeRatings')) || {};

            if (watchedList.length === 0) {
                ratingGrid.innerHTML = '<p style="color: #64748b; font-weight: bold; grid-column: 1 / -1; text-align: center; padding: 40px 0;">評価できるアニメがまだありません。</p>';
                return;
            }

            ratingGrid.innerHTML = '';

            watchedList.forEach(anime => {
                let imageHTML = '';
                if (anime.image && anime.image.trim() !== '') {
                    imageHTML = `
                        <div class="thumb-wrapper">
                            <img src="${anime.image}" class="anime-thumb" alt="" onerror="this.style.display='none'; if(this.nextElementSibling) this.nextElementSibling.style.display='flex';">
                            <div class="no-image-placeholder" style="display: none;">NO IMAGE</div>
                        </div>
                    `;
                } else {
                    imageHTML = `
                        <div class="thumb-wrapper">
                            <div class="no-image-placeholder">NO IMAGE</div>
                        </div>
                    `;
                }
                
                const animeRate = ratings[anime.id] || { character: 0, art: 0, tempo: 0, story: 0, comment: '' };
                tempRatings[anime.id] = { ...animeRate };

                const totalStars = ((Number(animeRate.character || 0) + Number(animeRate.art || 0) + Number(animeRate.tempo || 0) + Number(animeRate.story || 0)) / 4).toFixed(1);
                const savedComment = animeRate.comment || '';

                let rowsHTML = '';
                axes.forEach(axis => {
                    let starsHTML = '';
                    for (let i = 1; i <= 5; i++) {
                        starsHTML += `<span class="star ${i <= (animeRate[axis] || 0) ? 'active' : ''}" data-anime="${anime.id}" data-axis="${axis}" data-value="${i}">★</span>`;
                    }
                    rowsHTML += `
                        <div class="rating-row">
                            <span class="rating-label">${axesJa[axis]}</span>
                            <div class="stars-container">${starsHTML}</div>
                        </div>
                    `;
                });

                const cardHTML = `
                    <div class="rating-card" id="card-${anime.id}">
                        ${imageHTML}
                        <div class="rating-info">
                            <p class="anime-title" title="${anime.title}">${anime.title}</p>
                            ${rowsHTML}
                            
                            <textarea class="comment-box" id="comment-${anime.id}" placeholder="作品の感想やメモを自由に書けます...">${savedComment}</textarea>

                            <div class="total-score-box">
                                <div class="total-stars" id="total-val-${anime.id}">⭐ 総合: ${totalStars}</div>
                                <button class="btn-save-rating" id="save-btn-${anime.id}" data-anime="${anime.id}">保存する</button>
                            </div>
                        </div>
                    </div>
                `;
                ratingGrid.insertAdjacentHTML('beforeend', cardHTML);
            });

            // 星のインタラクション
            document.querySelectorAll('.stars-container').forEach(container => {
                const stars = container.querySelectorAll('.star');
                stars.forEach(star => {
                    star.addEventListener('click', (e) => {
                        const animeId = e.currentTarget.getAttribute('data-anime');
                        const axis = e.currentTarget.getAttribute('data-axis');
                        const val = parseInt(e.currentTarget.getAttribute('data-value'));
                        changeTempRating(animeId, axis, val);
                    });

                    star.addEventListener('mouseenter', (e) => {
                        const currentVal = parseInt(e.currentTarget.getAttribute('data-value'));
                        stars.forEach(s => {
                            const sVal = parseInt(s.getAttribute('data-value'));
                            if (sVal <= currentVal) { s.classList.add('hover-active'); } 
                            else { s.classList.remove('hover-active'); }
                        });
                    });
                });

                container.addEventListener('mouseleave', () => {
                    stars.forEach(s => s.classList.remove('hover-active'));
                });
            });

            // 保存ボタン
            document.querySelectorAll('.btn-save-rating').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const animeId = e.currentTarget.getAttribute('data-anime');
                    commitRating(animeId);
                });
            });
        }

        function changeTempRating(animeId, axis, value) {
            let temp = tempRatings[animeId];
            if (temp[axis] === value) { temp[axis] = 0; } else { temp[axis] = value; }

            const card = document.getElementById(`card-${animeId}`);
            const stars = card.querySelectorAll(`.star[data-axis="${axis}"]`);
            stars.forEach(s => {
                const sVal = parseInt(s.getAttribute('data-value'));
                if (sVal <= temp[axis]) { s.classList.add('active'); } 
                else { s.classList.remove('active'); }
            });

            const newTotal = ((Number(temp.character) + Number(temp.art) + Number(temp.tempo) + Number(temp.story)) / 4).toFixed(1);
            document.getElementById(`total-val-${animeId}`).textContent = `⭐ 総合: ${newTotal}`;

            const saveBtn = document.getElementById(`save-btn-${animeId}`);
            saveBtn.textContent = "変更を保存する";
            saveBtn.classList.remove('saved');
        }

        function commitRating(animeId) {
            let ratings = JSON.parse(localStorage.getItem('animeRatings')) || {};
            const commentElement = document.getElementById(`comment-${animeId}`);
            const textComment = commentElement ? commentElement.value : '';

            const animeInfo = watchedList.find(item => String(item.id) === String(animeId));
            const animeTitle = animeInfo ? animeInfo.title : '不明な作品';
            
            // 🛑 ここでも念のためガード（「不明な作品」は送信させない）
            if (animeTitle.includes('不明')) return;

            const animeImage = animeInfo ? animeInfo.image : '';
            const seasonName = animeInfo ? (animeInfo.season_name || '2026-spring') : '2026-spring';

            const charScore = Number(tempRatings[animeId].character || 0);
            const artScore = Number(tempRatings[animeId].art || 0);
            const tempoScore = Number(tempRatings[animeId].tempo || 0);
            const storyScore = Number(tempRatings[animeId].story || 0);
            const computedTotal = ((charScore + artScore + tempoScore + storyScore) / 4).toFixed(1);

            ratings[animeId] = {
                ...tempRatings[animeId],
                total: Number(computedTotal),
                comment: textComment
            };

            localStorage.setItem('animeRatings', JSON.stringify(ratings));

            const saveBtn = document.getElementById(`save-btn-${animeId}`);
            if (saveBtn) {
                saveBtn.textContent = "⏳ 同期中...";
                saveBtn.style.pointerEvents = "none";
            }

            const googleId = localStorage.getItem('googleId');
            
            if (googleId) {
                const payload = {
                    googleId: googleId,
                    animeId: String(animeId),
                    anime_id: String(animeId),
                    title: animeTitle,
                    image: animeImage, 
                    season_name: seasonName,
                    character: charScore,
                    art: artScore,
                    tempo: tempoScore,
                    story: storyScore,
                    comment: textComment,
                    episode: 1
                };

                fetch(`${API_BASE_URL}/api/ratings`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                })
                .then(res => {
                    if (!res.ok) throw new Error('サーバー応答エラー');
                    return res.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        return fetch(`${API_BASE_URL}/api/records`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                    }
                    throw new Error('評価保存ステップで失敗');
                })
                .then(res => res.json())
                .then(recordData => {
                    showSavedSuccessStyle(saveBtn);
                })
                .catch(err => {
                    console.error('サーバーへの評価・レコード送信エラー:', err);
                    if (saveBtn) {
                        saveBtn.textContent = "⚠️ ローカルのみ保存";
                        saveBtn.style.pointerEvents = "auto";
                        setTimeout(() => { saveBtn.textContent = "保存する"; }, 2500);
                    }
                });
            } else {
                showSavedSuccessStyle(saveBtn);
            }
        }

        function showSavedSuccessStyle(saveBtn) {
            if (!saveBtn) return;
            saveBtn.style.pointerEvents = "auto";
            saveBtn.textContent = "✓ 保存されました";
            saveBtn.classList.add('saved');
            
            setTimeout(() => {
                if(saveBtn.classList.contains('saved')) {
                    saveBtn.textContent = "保存する";
                }
            }, 2000);
        }
    </script>
</body>
</html>
