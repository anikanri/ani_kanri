<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght=100..900&display=swap" rel="stylesheet">
    <title>プロフィール設定 - アニ管理</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; font-family: 'Noto Sans JP', sans-serif; background-color: #f4f6f9; color: #333; }
        main { flex: 1; padding: 120px 0 60px; }
        .container { max-width: 600px; margin: 0 auto; width: 90%; }
        
        /* 📱 ヘッダー */
        header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid #1e293b; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; box-sizing: border-box; }
        .row { max-width: 1400px; margin: 0 auto; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; font-size: 24px; color: white; letter-spacing: -0.5px; text-decoration: none; }
        .menu { display: flex; gap: 12px; list-style: none; margin: 0; padding: 0; align-items: center; }
        .menu a { color: #cbd5e1; text-decoration: none; font-size: 16px; font-weight: 800; padding: 10px 22px; border-radius: 24px; transition: all 0.25s ease; }

        /* 設定カード */
        .settings-card { background: white; border-radius: 24px; padding: 35px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .settings-title { font-size: 20px; font-weight: 900; color: #0f172a; margin-top: 0; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; }
        
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-weight: 800; font-size: 14px; margin-bottom: 10px; color: #475569; }
        .form-group input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 15px; background: #f8fafc; transition: all 0.2s; }
        .form-group input:focus { border-color: #3b82f6; background: white; outline: none; }
        
        .btn-save { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(16,185,129,0.2); transition: 0.2s; }
        .btn-save:hover { opacity: 0.95; transform: translateY(-1px); }

        .back-link { display: block; text-align: center; margin-top: 20px; color: #64748b; font-weight: 800; font-size: 14px; text-decoration: none; }
        .back-link:hover { color: #0f172a; }
    </style>
</head>
<body>

    <header>
        <div class="row"> 
         <a href="./" class="logo">アニ管理</a>
         <nav>
            <ul class="menu">      
              <li><a href="./search.html">検索</a></li>
              <li><a href="./rating.html">評価</a></li>
              <li><a href="./users/index.html">マイページ</a></li>
            </ul>
         </nav>
        </div>
    </header>

    <main>
        <div class="container">
            
            <div class="settings-card">
                <h3 class="settings-title">⚙️ プロフィール設定</h3>
                
                <div class="form-group">
                    <label for="username-input">👤 新しいユーザー名</label>
                    <input type="text" id="username-input" placeholder="名前を入力してください">
                </div>
                
                <div class="form-group">
                    <label for="avatar-input">🖼️ アイコン画像URL</label>
                    <input type="text" id="avatar-input" placeholder="https://example.com/your-icon.png">
                    <p style="font-size: 11px; color: #94a3b8; margin: 6px 0 0 0;">※インターネット上の画像URLを貼り付けるとアイコンが変わります。</p>
                </div>
                
                <button class="btn-save" onclick="saveProfile()">設定変更を保存する</button>
                
                <a href="./users/index.html" class="back-link">⬅️ マイページに戻って確認する</a>
            </div>

        </div>
    </main>

    <script>
        window.onload = function() {
            loadCurrentProfile();
        };

        // 現在入っている名前とアイコンURLを最初からフォームに表示させておく
        function loadCurrentProfile() {
            const savedName = localStorage.getItem('username') || '';
            const savedAvatar = localStorage.getItem('userAvatar') || '';
            document.getElementById('username-input').value = savedName;
            document.getElementById('avatar-input').value = savedAvatar;
        }

        // 変更保存
        function saveProfile() {
            const newName = document.getElementById('username-input').value.trim();
            const newAvatar = document.getElementById('avatar-input').value.trim();

            if(!newName) {
                alert('ユーザー名が空欄です。入力してください！');
                return;
            }

            localStorage.setItem('username', newName);
            localStorage.setItem('userAvatar', newAvatar);
            
            alert('プロフィールの変更内容を保存しました！');
        }
    </script>
</body>
</html>
