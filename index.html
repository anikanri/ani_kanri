<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght=100..900&display=swap" rel="stylesheet">
    <title>アニ管理 - ホーム</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; font-family: 'Noto Sans JP', sans-serif; background-color: #f4f6f9; color: #333; }
        main { flex: 1; padding: 120px 0 60px; }
        .container { max-width: 1200px; margin: 0 auto; width: 90%; }
        
        /* 📱 統一された大型美しいヘッダー */
        header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid #1e293b; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; box-sizing: border-box; }
        .row { max-width: 1400px; margin: 0 auto; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; font-size: 24px; color: white; letter-spacing: -0.5px; text-decoration: none; }
        .menu { display: flex; gap: 12px; list-style: none; margin: 0; padding: 0; align-items: center; }
        .menu a { color: #cbd5e1; text-decoration: none; font-size: 16px; font-weight: 800; padding: 10px 22px; border-radius: 24px; transition: all 0.2s ease; letter-spacing: 0.5px; }
        .menu a:hover { color: white; background: rgba(255, 255, 255, 0.08); }
        
        /* 🏅 マイランキングページ誘導ボタン */
        .menu a.my-rank-nav-btn { background: linear-gradient(135deg, #ff9500, #ffcc00); color: #0f172a; box-shadow: 0 4px 10px rgba(255,149,0,0.2); }
        .menu a.my-rank-nav-btn:hover { color: #0f172a; opacity: 0.9; }

        .section-title { font-size: 24px; font-weight: 900; color: #0f172a; margin-bottom: 24px; border-left: 6px solid #ff3b30; padding-left: 12px; }

        /* 👈👉 今期アニメ用の横スクロールコンテナ */
        .scroll-container { display: flex; gap: 20px; overflow-x: auto; padding-bottom: 15px; margin-bottom: 50px; scrollbar-width: thin; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .scroll-container::-webkit-scrollbar { height: 8px; }
        .scroll-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        
        /* 横スクロール用のカードサイズ固定設定 */
        .scroll-card { flex: 0 0 200px; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; display: flex; flex-direction: column; position: relative; }

        /* 👥 ランキング用グリッド表示 */
        .anime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 24px; margin-bottom: 60px; }
        .anime-card { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; display: flex; flex-direction: column; position: relative; }

        /* 共通カードパーツ */
        .anime-img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; display: block; }
        .anime-body { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
        .anime-title-text { font-weight: 800; font-size: 14px; color: #0f172a; margin: 0 0 10px 0; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 38px; }
        
        /* 👑 ランキング順位バッジ */
        .rank-badge { position: absolute; top: 12px; left: 12px; width: 34px; height: 34px; border-radius: 50%; color: white; font-weight: 900; font-size: 15px; display: flex; justify-content: center; align-items: center; box-shadow: 0 4px 8px rgba(0,0,0,0.15); z-index: 10; }
        .rank-1 { background: linear-gradient(135deg, #ffd700, #ffa500); }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0, #808080); }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #8b4513); }
        .rank-other { background: #475569; }
        .score-tag { font-size: 13px; color: #ffcc00; font-weight: bold; background: #0f172a; padding: 5px; border-radius: 8px; text-align: center; }

        /* ➕ 追加ボタンのスタイリング */
        .btn-add-list { width: 100%; background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; border: none; padding: 8px; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.2); text-align: center; display: block; margin-top: 10px; box-sizing: border-box; }
        .btn-add-list:hover { background: linear-gradient(135deg, #1d4ed8, #2563eb); transform: translateY(-1px); box-shadow: 0 6px 14px rgba(59, 130, 246, 0.3); }
        .btn-add-list.added { background: #e2e8f0; color: #64748b; cursor: not-allowed; box-shadow: none; transform: none; }

        /* 🔒 制限用ロック画面の配置スタイル */
        .lock-container { background: white; border-radius: 24px; padding: 40px; text-align: center; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.02); margin-top: 20px; }
        .lock-icon { font-size: 48px; margin-bottom: 16px; display: inline-block; }
        .lock-title { font-size: 20px; font-weight: 900; color: #0f172a; margin: 0 0 10px 0; }
        .lock-text { font-size: 14px; color: #475569; font-weight: 700; margin: 0 0 20px 0; }
        .btn-lock-nav { display: inline-block; background: #0f172a; color: #ffcc00; text-decoration: none; font-weight: 800; font-size: 14px; padding: 12px 24px; border-radius: 12px; transition: all 0.2s; }
        .btn-lock-nav:hover { background: #1e293b; transform: translateY(-1px); }

        /* 🔔 トースト通知 */
        .toast { position: fixed; bottom: 24px; right: 24px; background: #0f172a; color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 800; box-shadow: 0 10px 25px rgba(0,0,0,0.2); opacity: 0; transform: translateY(10px); pointer-events: none; transition: all 0.3s ease; z-index: 3000; }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* 📱 スマホ画面用の調節設定 */
        @media (max-width: 768px) {
            main { padding: 90px 0 40px; }
            .section-title { font-size: 18px; margin-bottom: 16px; }
            .scroll-container .scroll-card { flex: 0 0 140px; border-radius: 12px; }
            .anime-title-text { font-size: 12px; height: 34px; margin-bottom: 6px; }
            .btn-add-list { padding: 6px; font-size: 11px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="row"> 
            <a href="./" class="logo">アニ管理</a>
            <nav>
                <ul class="menu">      
                    <li><a href="./search.html">検索</a></li>
                    <li><a href="./rating.html">評価</a></li>
                    <li><a href="./users/index.html">マイページ</a></li>
                    <li><a href="./my-ranking.html" class="my-rank-nav-btn">🏅 マイランキング</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <section>
                <h3 class="section-title">📺 今期話題のアニメ作品</h3>
                <div class="scroll-container" id="current-season-scroll">
                    <p style="color: #64748b; font-weight: bold; padding: 20px;">アニメデータを読み込み中...</p>
                </div>
            </section>

            <section style="border-top: 2px solid #e2e8f0; padding-top: 40px;">
                <h3 class="section-title" id="current-rank-title">🏆 今期アニメ総合ランキング</h3>
                <div class="anime-grid" id="current-season-ranking-grid">
                    </div>
            </section>

            <section style="border-top: 2px solid #e2e8f0; padding-top: 40px;">
                <h3 class="section-title">👥 全アニメ総合ランキング</h3>
                <div class="anime-grid" id="global-ranking-grid">
                    </div>
            </section>
        </div>
    </main>

    <footer style="background-color: #0f172a; color: #94a3b8; padding: 40px 20px; text-align: center; font-size: 14px;">
        <p style="margin: 0 0 12px 0;">
            <a href="./terms.html" style="color: #94a3b8; text-decoration: none; font-weight: 800; font-size: 13px; transition: color 0.2s;" onmouseover="this.style.color='white'" onmouseout="this.style.color='#94a3b8'">
                利用規約・プライバシーポリシー
            </a>
        </p>
        <p style="color: #334155; font-size: 12px; margin: 0;">&copy; 2026 アニ管理 All Rights Reserved.</p>
    </footer>

    <div class="toast" id="toast-notification">🌟 マイページにリスト追加しました！</div>

    <script>
        // 🌐 【最重要】マイページと共通のRenderのURL
        const API_BASE_URL = "https://ani-kanri.onrender.com";
        const CURRENT_SEASON = '2026-spring'; 
        const ANNICT_TOKEN = 'xM12QcwCJtWXmLP3vhZ-ERrDx5wcd5Xr6fl75Klnybk';
        let fetchedAnimesGlobal = []; 

        window.onload = function() {
            updateSeasonTitleDisplay();
            fetchCurrentSeasonAnimes();
            
            // 🔒 ログイン状態をチェックしてランキング読み込み、またはロック画面表示
            checkLoginAndLoadRankings();
        };

        function updateSeasonTitleDisplay() {
            const titleEl = document.getElementById('current-rank-title');
            if (titleEl) {
                let seasonText = "今期";
                if(CURRENT_SEASON.includes("spring")) seasonText = "春期";
                if(CURRENT_SEASON.includes("summer")) seasonText = "夏期";
                if(CURRENT_SEASON.includes("autumn")) seasonText = "秋期";
                if(CURRENT_SEASON.includes("winter")) seasonText = "冬期";
                titleEl.innerText = `🏆 ${seasonText}アニメ総合ランキング`;
            }
        }

        // 今期の「話題の作品（Annict APIからリアルタイム取得）」※ここはゲストでも見られます
        function fetchCurrentSeasonAnimes() {
            const scrollContainer = document.getElementById('current-season-scroll');
            const apiURL = `https://api.annict.com/v1/works?filter_season=${CURRENT_SEASON}&sort_watchers_count=desc&per_page=15&access_token=${ANNICT_TOKEN}`;

            fetch(apiURL)
                .then(res => res.json())
                .then(data => {
                    const works = data.works || [];
                    fetchedAnimesGlobal = works; 
                    
                    if (works.length === 0) {
                        scrollContainer.innerHTML = '<p style="color: #64748b; padding: 20px;">今期の作品情報が見つかりませんでした。</p>';
                        return;
                    }

                    const watchedList = JSON.parse(localStorage.getItem('watchedAnimes')) || [];
                    const savedIds = watchedList.map(item => String(item.id));

                    scrollContainer.innerHTML = '';
                    works.forEach(anime => {
                        let imageUrl = '';
                        if (anime.images && anime.images.recommended_url) imageUrl = anime.images.recommended_url;
                        else if (anime.images && anime.images.facebook && anime.images.facebook.og_image_url) imageUrl = anime.images.facebook.og_image_url;

                        let imageHTML = imageUrl ? `<img src="${imageUrl}" class="anime-img" alt="">` : `<div class="anime-img" style="background:#334155; display:flex; justify-content:center; align-items:center; color:#64748b; font-weight:bold;">NO IMAGE</div>`;

                        const isAdded = savedIds.includes(String(anime.id));
                        const buttonHTML = isAdded 
                            ? `<button class="btn-add-list added" disabled>✅ リスト追加済み</button>`
                            : `<button class="btn-add-list" id="btn-${anime.id}" onclick="addFromHome('${anime.id}')">➕ リストに追加</button>`;

                        const card = `
                            <div class="scroll-card">
                                ${imageHTML}
                                <div class="anime-body">
                                    <p class="anime-title-text">${anime.title}</p>
                                    <span style="font-size:11px; color:#ff3b30; font-weight:bold; background:#fff1f0; padding:3px 8px; border-radius:5px; text-align:center; display:inline-block; width:fit-content;">🔥 注目作品</span>
                                    ${buttonHTML} 
                                </div>
                            </div>
                        `;
                        scrollContainer.insertAdjacentHTML('beforeend', card);
                    });
                }).catch(() => {
                    scrollContainer.innerHTML = '<p style="color: #64748b; padding: 20px;">データの取得に失敗しました。</p>';
                });
        }

        function addFromHome(animeId) {
            const anime = fetchedAnimesGlobal.find(item => String(item.id) === String(animeId));
            if (!anime) return;

            let watchedList = JSON.parse(localStorage.getItem('watchedAnimes')) || [];
            if (watchedList.some(item => String(item.id) === String(animeId))) return;

            let imageUrl = '';
            if (anime.images && anime.images.recommended_url) imageUrl = anime.images.recommended_url;

            const newWatchedItem = {
                id: anime.id,
                title: anime.title,
                image: imageUrl,
                season_name: anime.season_name || CURRENT_SEASON
            };

            watchedList.push(newWatchedItem);
            localStorage.setItem('watchedAnimes', JSON.stringify(watchedList));

            const targetBtn = document.getElementById(`btn-${animeId}`);
            if (targetBtn) {
                targetBtn.classList.add('added');
                targetBtn.disabled = true;
                targetBtn.innerText = '✅ リスト追加済み';
            }

            const toast = document.getElementById('toast-notification');
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        // ==========================================
        // 🔒 認証チェック ＆ ランキング制限ロジック
        // ==========================================
        function checkLoginAndLoadRankings() {
            const savedName = localStorage.getItem('username');
            const googleId = localStorage.getItem('googleId');

            const currentGrid = document.getElementById('current-season-ranking-grid');
            const globalGrid = document.getElementById('global-ranking-grid');

            // ログイン済みの場合のみRenderサーバーから実データを読み込む
            if (savedName && savedName !== 'ゲストユーザー' && googleId) {
                currentGrid.innerHTML = '<p style="color: #64748b; font-weight: bold; padding: 20px;">サーバーから集計中...</p>';
                globalGrid.innerHTML = '<p style="color: #64748b; font-weight: bold; padding: 20px;">サーバーから集計中...</p>';
                fetchCloudRankings();
            } else {
                // 🔒 未ログイン時は、きれいなロック画面風UIを表示して弾く
                const lockHTML = `
                    <div class="lock-container" style="grid-column: 1 / -1; width: 100%;">
                        <span class="lock-icon">🔒</span>
                        <h4 class="lock-title">ランキング閲覧制限</h4>
                        <p class="lock-text">みんなの4軸評価ランキングを見るには、Googleアカウントでのログインが必要です。</p>
                        <a href="./users/index.html" class="btn-lock-nav">👤 マイページでログインする</a>
                    </div>
                `;
                currentGrid.innerHTML = lockHTML;
                globalGrid.innerHTML = lockHTML;
            }
        }

        // ==========================================
        // 🔄 Renderサーバー（SQLite）から4軸評価データの集計を取得
        // ==========================================
        function fetchCloudRankings() {
            // Renderのデータベース内にある全ユーザーの評価データを集計するAPIエンドポイント
            fetch(`${API_BASE_URL}/api/rankings`)
            .then(res => {
                if (!res.ok) throw new Error('データ取得に失敗しました');
                return res.json();
            })
            .then(data => {
                // サーバーから返ってくるデータ（配列形式を想定）
                // 構成要素例: [{ title: "作品名", image: "URL", season_name: "2026-spring", character: 4.5, art: 4.2, tempo: 4.0, story: 4.7 }]
                const records = data.rankings || data || [];

                // 1. 今期アニメランキングの抽出（CURRENT_SEASONに合致するもの）
                const currentSeasonItems = records.filter(item => item.season_name === CURRENT_SEASON);
                renderRankGrid('current-season-ranking-grid', currentSeasonItems);

                // 2. 全アニメ総合ランキングの抽出（全件対象）
                renderRankGrid('global-ranking-grid', records);
            })
            .catch(err => {
                console.error('ランキング同期エラー:', err);
                const errMsg = '<p style="color: #ff3b30; font-weight: bold; grid-column:1/-1; text-align:center; padding: 20px;">サーバーからのランキング取得に失敗しました。</p>';
                document.getElementById('current-season-ranking-grid').innerHTML = errMsg;
                document.getElementById('global-ranking-grid').innerHTML = errMsg;
            });
        }

        // 🎨 ランキングカード生成・計算処理
        function renderRankGrid(targetId, items) {
            const gridContainer = document.getElementById(targetId);
            if (!gridContainer) return;

            if (items.length === 0) {
                gridContainer.innerHTML = '<p style="color: #64748b; font-weight: bold; grid-column: 1/-1; text-align: center; padding: 30px 0;">まだ集計に必要な評価データがありません。</p>';
                return;
            }

            // 💡 サーバーから取得したデータに基づいて「キャラクター、作画、テンポ、ストーリー」の4軸の平均をフロントで計算
            // （もしサーバー側で既に finalScore が計算されている場合は、そのまま使用可能にします）
            let rankedItems = items.map(anime => {
                // 各カラム名がDBと紐づく（もし無ければデフォルト3.0にする安全設計）
                const character = Number(anime.character || anime.character_score || 0);
                const art = Number(anime.art || anime.art_score || 0);
                const tempo = Number(anime.tempo || anime.tempo_score || 0);
                const story = Number(anime.story || anime.story_score || 0);
                
                // 4軸の平均値を割り出す
                const calculatedScore = (character + art + tempo + story) / 4;
                const finalScore = anime.finalScore || calculatedScore || 0;

                return {
                    title: anime.title || anime.anime_title,
                    image: anime.image || anime.anime_image || '',
                    finalScore: finalScore
                };
            });

            // 総合スコアが高い順（降順）にソート
            rankedItems.sort((a, b) => b.finalScore - a.finalScore);

            gridContainer.innerHTML = '';
            // 上位12件を表示
            rankedItems.slice(0, 12).forEach((anime, idx) => {
                const rank = idx + 1;
                let badgeClass = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-other';
                let imageHTML = anime.image ? `<img src="${anime.image}" class="anime-img" alt="">` : `<div class="anime-img" style="background:#334155; display:flex; justify-content:center; align-items:center; color:#64748b; font-weight:bold;">NO IMAGE</div>`;

                const card = `
                    <div class="anime-card">
                        <div class="rank-badge ${badgeClass}">${rank}</div>
                        ${imageHTML}
                        <div class="anime-body">
                            <p class="anime-title-text">${anime.title}</p>
                            <div class="score-tag">⭐ 総合平均: ${anime.finalScore.toFixed(1)}</div>
                        </div>
                    </div>
                `;
                gridContainer.insertAdjacentHTML('beforeend', card);
            });
        }
    </script>
</body>
</html>
