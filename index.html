<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <title>アニ管理 - ホーム</title>
    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; font-family: 'Noto Sans JP', sans-serif; background-color: #f4f6f9; color: #333; }
        main { flex: 1; padding: 120px 0 60px; }
        .container { max-width: 1400px; margin: 0 auto; width: 92%; }
        
        /* 📱 ヘッダー */
        header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid #1e293b; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; box-sizing: border-box; }
        .row { max-width: 1400px; margin: 0 auto; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-weight: 900; font-size: 24px; color: white; letter-spacing: -0.5px; text-decoration: none; }
        .menu { display: flex; gap: 12px; list-style: none; margin: 0; padding: 0; align-items: center; }
        .menu a { color: #cbd5e1; text-decoration: none; font-size: 15px; font-weight: 800; padding: 10px 22px; border-radius: 24px; transition: all 0.2s ease; }
        .menu a:hover { color: white; background: rgba(255, 255, 255, 0.08); }
        .menu a.my-rank-nav-btn { background: linear-gradient(135deg, #ff9500, #ffcc00); color: #0f172a; box-shadow: 0 4px 10px rgba(255,149,0,0.2); }

        .section-title { font-size: 22px; font-weight: 900; color: #0f172a; margin-bottom: 24px; border-left: 6px solid #ff3b30; padding-left: 12px; display: flex; align-items: center; gap: 10px; }

        /* 👈👉 スライド（横スクロール）コンテナの共通設定 */
        .scroll-container { 
            display: flex; 
            gap: 20px; 
            overflow-x: auto; 
            padding: 10px 4px 25px 4px; 
            margin-bottom: 40px; 
            scrollbar-width: thin; 
            scroll-behavior: smooth; 
            -webkit-overflow-scrolling: touch;
            /* スマホでピタッと止まるように設定 */
            scroll-snap-type: x mandatory;
        }
        .scroll-container::-webkit-scrollbar { height: 6px; }
        .scroll-container::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        
        /* 🎬 作品カード基本 */
        .scroll-card { 
            flex: 0 0 200px; 
            background: white; 
            border-radius: 18px; 
            overflow: hidden; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.06); 
            border: 1px solid #e2e8f0; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            scroll-snap-align: start;
            transition: transform 0.2s ease;
        }
        .scroll-card:hover { transform: translateY(-4px); }

        /* 🛠️ 画像コンテナ */
        .anime-img-wrapper { width: 100%; aspect-ratio: 3 / 4; background: #1e293b; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .anime-img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .img-placeholder { color: #64748b; font-weight: 900; font-size: 14px; text-align: center; position: absolute; }

        .anime-body { padding: 14px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; gap: 8px; }
        .anime-title-text { font-weight: 800; font-size: 14px; color: #0f172a; margin: 0; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 38px; }
        
        /* 👑 ランキング専用の工夫（バッジと王冠） */
        .rank-badge { 
            position: absolute; top: 10px; left: 10px; width: 38px; height: 38px; 
            border-radius: 50%; color: white; font-weight: 900; font-size: 16px; 
            display: flex; justify-content: center; align-items: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 10; 
            border: 2px solid white;
        }
        .rank-1 { background: linear-gradient(135deg, #ffd700, #ffa500); }
        .rank-2 { background: linear-gradient(135deg, #c0c0c0, #808080); }
        .rank-3 { background: linear-gradient(135deg, #cd7f32, #8b4513); }
        .rank-other { background: rgba(15, 23, 42, 0.8); }

        .score-tag { 
            font-size: 13px; color: #ffcc00; font-weight: 900; 
            background: #0f172a; padding: 6px 10px; border-radius: 10px; 
            text-align: center; display: flex; align-items: center; justify-content: center; gap: 4px;
        }

        /* ➕ 追加ボタン */
        .btn-add-list { width: 100%; background: linear-gradient(135deg, #2563eb, #3b82f6); color: white; border: none; padding: 8px; border-radius: 10px; font-size: 12px; font-weight: 800; cursor: pointer; transition: all 0.2s ease; margin-top: 5px; }
        .btn-add-list.added { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }

        /* 🔒 ロック画面 */
        .lock-container { background: white; border-radius: 24px; padding: 40px; text-align: center; border: 1px solid #e2e8f0; width: 100%; box-sizing: border-box; }
        .btn-lock-nav { display: inline-block; background: #0f172a; color: #ffcc00; text-decoration: none; font-weight: 800; padding: 12px 24px; border-radius: 12px; margin-top: 15px; }

        /* 🔔 通知 */
        .toast { position: fixed; bottom: 24px; right: 24px; background: #0f172a; color: white; padding: 12px 24px; border-radius: 12px; font-size: 14px; font-weight: 800; opacity: 0; transform: translateY(10px); pointer-events: none; transition: all 0.3s ease; z-index: 3000; }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* 📱 スマホ最適化（崩れ防止） */
        @media (max-width: 768px) {
            main { padding-top: 150px; }
            .row { flex-direction: column; gap: 12px; padding: 12px; }
            .logo { font-size: 20px; }
            .menu { width: 100%; justify-content: center; overflow-x: auto; white-space: nowrap; padding-bottom: 5px; }
            .menu a { font-size: 12px; padding: 8px 14px; }
            
            .section-title { font-size: 18px; margin-bottom: 16px; }
            .scroll-card { flex: 0 0 165px; border-radius: 14px; } /* カードを少し小さくして並びやすく */
            .rank-badge { width: 32px; height: 38px; font-size: 14px; }
            .anime-title-text { font-size: 12px; height: 34px; }
            .score-tag { font-size: 11px; padding: 4px 8px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="row"> 
            <a href="./" class="logo">アニ管理</a>
            <nav>
                <ul class="menu">      
                    <li><a href="./search.html">検索</a></li>
                    <li><a href="./rating.html">評価</a></li>
                    <li><a href="./users/index.html">マイページ</a></li>
                    <li><a href="./my-ranking.html" class="my-rank-nav-btn">🏅 マイランキング</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="container">
            <section>
                <h3 class="section-title"><i class="fa-solid fa-tv" style="color:#3b82f6;"></i> 📺 今期話題のアニメ作品</h3>
                <div class="scroll-container" id="current-season-scroll">
                    <p style="color: #64748b; font-weight: bold; padding: 20px;">読み込み中...</p>
                </div>
            </section>

            <section style="border-top: 2px solid #e2e8f0; padding-top: 40px;">
                <h3 class="section-title" id="current-rank-title">🏆 春アニメ総合ランキング</h3>
                <div class="scroll-container" id="current-season-ranking-grid"></div>
            </section>

            <section style="border-top: 2px solid #e2e8f0; padding-top: 40px;">
                <h3 class="section-title"><i class="fa-solid fa-globe" style="color:#10b981;"></i> 👥 全アニメ総合ランキング</h3>
                <div class="scroll-container" id="global-ranking-grid"></div>
            </section>
        </div>
    </main>

    <footer style="background-color: #0f172a; color: #94a3b8; padding: 40px 20px; text-align: center; font-size: 14px;">
        <p style="margin: 0 0 12px 0;"><a href="./terms.html" style="color: #94a3b8; text-decoration: none; font-weight: 800;">利用規約・プライバシーポリシー</a></p>
        <p style="color: #334155; font-size: 12px; margin: 0;">&copy; 2026 アニ管理 All Rights Reserved.</p>
    </footer>

    <div class="toast" id="toast-notification">🌟 リストに追加しました！</div>

    <script>
        const API_BASE_URL = "https://ani-kanri.onrender.com";
        const CURRENT_SEASON = '2026-spring'; 
        const ANNICT_TOKEN = 'xM12QcwCJtWXmLP3vhZ-ERrDx5wcd5Xr6fl75Klnybk';
        let animeDataMap = new Map(); 

        window.onload = function() {
            updateSeasonTitleDisplay();
            syncUserAccountDataFirst(); 
        };

        function updateSeasonTitleDisplay() {
            const titleEl = document.getElementById('current-rank-title');
            if (titleEl) {
                let seasonText = "春期";
                if(CURRENT_SEASON.includes("summer")) seasonText = "夏期";
                if(CURRENT_SEASON.includes("autumn")) seasonText = "秋期";
                if(CURRENT_SEASON.includes("winter")) seasonText = "冬期";
                titleEl.innerHTML = `<i class="fa-solid fa-crown" style="color:#ffcc00;"></i> 🏆 ${seasonText}アニメ総合ランキング`;
            }
        }

        // 🌟 型とプロパティを揃えて同期
        function syncUserAccountDataFirst() {
            const googleId = localStorage.getItem('googleId');
            const savedName = localStorage.getItem('username');
            if (googleId && savedName && savedName !== 'ゲストユーザー') {
                fetch(`${API_BASE_URL}/api/ratings/${googleId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.status === 'success' && data.ratings) {
                        let newWatchedList = [];
                        let newAnimeRatings = {};
                        data.ratings.forEach(r => {
                            const animeId = Number(r.anime_id || r.id);
                            const title = r.anime_title || r.title || '';
                            const image = r.anime_image || r.image || '';
                            if (!animeId || !title || title.includes('不明')) return;
                            if (!newWatchedList.some(item => Number(item.id) === animeId)) {
                                newWatchedList.push({ id: animeId, title: title, image: image, season_name: r.season_name || CURRENT_SEASON });
                            }
                            const c = Number(r.character || 0), a = Number(r.art || 0), t = Number(r.tempo || 0), s = Number(r.story || 0);
                            newAnimeRatings[animeId] = { character: c, art: a, tempo: t, story: s, total: Number(((c+a+t+s)/4).toFixed(1)), comment: r.comment || '' };
                        });
                        localStorage.setItem('watchedAnimes', JSON.stringify(newWatchedList));
                        localStorage.setItem('animeRatings', JSON.stringify(newAnimeRatings));
                    }
                    proceedLoading();
                }).catch(() => proceedLoading());
            } else { proceedLoading(); }
        }

        function proceedLoading() { fetchCurrentSeasonAnimes(); checkLoginAndLoadRankings(); }

        function handleImgError(img, text) {
            img.style.display = 'none'; 
            const placeholder = document.createElement('div');
            placeholder.className = 'img-placeholder';
            placeholder.innerText = text;
            img.parentNode.appendChild(placeholder);
        }

        function fetchCurrentSeasonAnimes() {
            const scrollContainer = document.getElementById('current-season-scroll');
            fetch(`https://api.annict.com/v1/works?filter_season=${CURRENT_SEASON}&sort_watchers_count=desc&per_page=15&access_token=${ANNICT_TOKEN}`)
                .then(res => res.json())
                .then(data => {
                    const works = data.works || [];
                    if (works.length === 0) { scrollContainer.innerHTML = '<p>データがありません</p>'; return; }
                    const watchedList = JSON.parse(localStorage.getItem('watchedAnimes')) || [];
                    const savedIds = watchedList.map(item => Number(item.id));
                    scrollContainer.innerHTML = '';
                    works.forEach(anime => {
                        const nid = Number(anime.id);
                        const img = (anime.images && anime.images.recommended_url) || (anime.images && anime.images.facebook && anime.images.facebook.og_image_url) || '';
                        animeDataMap.set(nid, { id: nid, title: anime.title, image: img, season_name: anime.season_name || CURRENT_SEASON });
                        
                        const isAdded = savedIds.includes(nid);
                        const btn = isAdded ? `<button class="btn-add-list added" disabled>✅ リスト追加済み</button>` : `<button class="btn-add-list" id="btn-${nid}" onclick="addFromHome(${nid})">➕ リストに追加</button>`;
                        
                        scrollContainer.insertAdjacentHTML('beforeend', `
                            <div class="scroll-card">
                                <div class="anime-img-wrapper"><img src="${img}" class="anime-img" onerror="handleImgError(this, 'NO IMAGE')"></div>
                                <div class="anime-body">
                                    <p class="anime-title-text">${anime.title}</p>
                                    ${btn}
                                </div>
                            </div>
                        `);
                    });
                });
        }

        function addFromHome(animeId) {
            const nid = Number(animeId);
            const anime = animeDataMap.get(nid);
            if (!anime) return;
            let watchedList = JSON.parse(localStorage.getItem('watchedAnimes')) || [];
            if (watchedList.some(item => Number(item.id) === nid)) return;
            watchedList.push(anime);
            localStorage.setItem('watchedAnimes', JSON.stringify(watchedList));
            const targetBtn = document.getElementById(`btn-${nid}`);
            if (targetBtn) { targetBtn.classList.add('added'); targetBtn.disabled = true; targetBtn.innerText = '✅ リスト追加済み'; }
            const toast = document.getElementById('toast-notification');
            toast.classList.add('show'); setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }

        function checkLoginAndLoadRankings() {
            const savedName = localStorage.getItem('username');
            if (savedName && savedName !== 'ゲストユーザー') { fetchCloudRankings(); } 
            else {
                const lock = `<div class="lock-container"><span style="font-size:40px;">🔒</span><h4 style="margin:10px 0;">ランキング閲覧制限</h4><p style="font-size:13px;color:#64748b;">ログインすると詳細なスコアが見れます</p><a href="./users/index.html" class="btn-lock-nav">ログインする</a></div>`;
                document.getElementById('current-season-ranking-grid').innerHTML = lock;
                document.getElementById('global-ranking-grid').innerHTML = lock;
            }
        }

        function fetchCloudRankings() {
            fetch(`${API_BASE_URL}/api/rankings`)
            .then(res => res.json())
            .then(data => {
                const records = data.rankings || data || [];
                const cloudScoreMap = new Map();
                records.forEach(r => cloudScoreMap.set(Number(r.anime_id || r.id), Number(r.average_score || 0)));

                // 春アニメ限定（Annictの15作品ベース）
                let currentItems = [];
                animeDataMap.forEach((v, k) => {
                    currentItems.push({ ...v, average_score: cloudScoreMap.get(k) || 0 });
                });

                renderRankGrid('current-season-ranking-grid', currentItems, true);
                renderRankGrid('global-ranking-grid', records, false);
            });
        }
        function renderRankGrid(targetId, items, showAll) {
            const container = document.getElementById(targetId);
            let ranked = items.map(a => {
                // 🛠️ 画像URLのプロパティ名のブレ（anime_image, image, animeImage）をすべて安全に回収する
                const targetImg = a.anime_image || a.image || a.animeImage || '';
                
                return {
                    id: Number(a.anime_id || a.id),
                    title: a.anime_title || a.title || '',
                    image: targetImg, // 👈 補完したURLをセット
                    score: Number(a.average_score || 0)
                };
            }).filter(a => a.title && !a.title.includes('不明'));

            if (!showAll) ranked = ranked.filter(a => a.score > 0);
            ranked.sort((a, b) => b.score - a.score);

            if (ranked.length === 0) { container.innerHTML = '<p style="padding:20px;">データがありません</p>'; return; }

            container.innerHTML = '';
            ranked.slice(0, 15).forEach((anime, idx) => {
                const rank = idx + 1;
                const badge = rank === 1 ? 'rank-1' : rank === 2 ? 'rank-2' : rank === 3 ? 'rank-3' : 'rank-other';
                const crown = rank === 1 ? '<i class="fa-solid fa-crown"></i> ' : '';
                
                container.insertAdjacentHTML('beforeend', `
                    <div class="scroll-card">
                        <div class="rank-badge ${badge}">${rank}</div>
                        <div class="anime-img-wrapper"><img src="${anime.image}" class="anime-img" onerror="handleImgError(this, 'NO IMAGE')"></div>
                        <div class="anime-body">
                            <p class="anime-title-text">${anime.title}</p>
                            <div class="score-tag">${crown}★ ${anime.score.toFixed(1)}</div>
                        </div>
                    </div>
                `);
            });
        }
        
    </script>
</body>
</html>
