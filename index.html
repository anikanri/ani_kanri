<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght=100..900&display=swap" rel="stylesheet">
    <title>プロフィール設定 - アニ管理</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        html, body { height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; font-family: 'Noto Sans JP', sans-serif; background-color: #f4f6f9; color: #333; }
        main { flex: 1; padding: 120px 0 60px; }
        .container { max-width: 600px; margin: 0 auto; width: 90%; }
        
        /* 📱 ヘッダー（スマホ対応：縦伸びを防ぐ設定を追加） */
        header { background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(8px); border-bottom: 1px solid #1e293b; position: fixed; top: 0; left: 0; width: 100%; z-index: 1000; box-sizing: border-box; }
        .row { max-width: 1400px; margin: 0 auto; padding: 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .logo { font-weight: 900; font-size: 24px; color: white; letter-spacing: -0.5px; text-decoration: none; }
        .menu { display: flex; gap: 12px; list-style: none; margin: 0; padding: 0; align-items: center; }
        .menu a { color: #cbd5e1; text-decoration: none; font-size: 16px; font-weight: 800; padding: 10px 22px; border-radius: 24px; transition: all 0.25s ease; }

        /* 設定カード */
        .settings-card { background: white; border-radius: 24px; padding: 35px; border: 1px solid #e2e8f0; box-shadow: 0 4px 20px rgba(0,0,0,0.02); }
        .settings-title { font-size: 20px; font-weight: 900; color: #0f172a; margin-top: 0; margin-bottom: 25px; border-bottom: 2px solid #f1f5f9; padding-bottom: 12px; }
        
        .form-group { margin-bottom: 24px; }
        .form-group label { display: block; font-weight: 800; font-size: 14px; margin-bottom: 10px; color: #475569; }
        .form-group input { width: 100%; padding: 14px; border-radius: 12px; border: 1px solid #cbd5e1; box-sizing: border-box; font-size: 15px; background: #f8fafc; transition: all 0.2s; }
        .form-group input:focus { border-color: #3b82f6; background: white; outline: none; }
        
        .btn-save { background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; width: 100%; padding: 14px; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; box-shadow: 0 4px 12px rgba(16,185,129,0.2); transition: 0.2s; margin-bottom: 15px; }
        .btn-save:hover { opacity: 0.95; transform: translateY(-1px); }

        /* Googleログインボタンの配置用スタイル */
        .google-login-area { margin-bottom: 30px; padding: 20px; background: #f8fafc; border-radius: 16px; border: 1px dashed #cbd5e1; text-align: center; }
        .google-login-title { font-size: 13px; font-weight: 800; color: #64748b; margin-top: 0; margin-bottom: 12px; }
        .google-btn-flex { display: flex; justify-content: center; }

        .back-link { display: block; text-align: center; margin-top: 20px; color: #64748b; font-weight: 800; font-size: 14px; text-decoration: none; }
        .back-link:hover { color: #0f172a; }

        /* スマホ用の縮尺・ヘッダー調整（CSSの一番下に配置） */
        @media screen and (max-width: 768px) {
            header { position: static; }
            main { padding: 30px 0 60px; }
            .row { flex-direction: column; text-align: center; }
            .menu { flex-wrap: wrap; justify-content: center; padding-top: 10px; }
            .menu a { padding: 8px 16px; font-size: 14px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="row"> 
         <a href="./" class="logo">アニ管理</a>
         <nav>
            <ul class="menu">      
              <li><a href="./search.html">検索</a></li>
              <li><a href="./rating.html">評価</a></li>
              <li><a href="./users/index.html">マイページ</a></li>
            </ul>
         </nav>
        </div>
    </header>

    <main>
        <div class="container">
            
            <div class="settings-card">
                <h3 class="settings-title">⚙️ プロフィール設定</h3>
                
                <div class="google-login-area">
                    <p class="google-login-title">Googleアカウントで簡単名前入力</p>
                    <div class="google-btn-flex">
                        <div id="g_id_onload"
                             data-client_id="xM12QcwCJtWXmLP3vhZ-ERrDx5wcd5Xr6fl75Klnybk"
                             data-callback="handleCredentialResponse">
                        </div>
                        <div class="g_id_signin" data-type="standard"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="username-input">👤 ユーザー名</label>
                    <input type="text" id="username-input" placeholder="名前を入力してください">
                </div>
                
                <div class="form-group">
                    <label for="avatar-input">🖼️ アイコン画像URL</label>
                    <input type="text" id="avatar-input" placeholder="https://example.com/your-icon.png">
                    <p style="font-size: 11px; color: #94a3b8; margin: 6px 0 0 0;">※インターネット上の画像URLを貼り付けるとアイコンが変わります。</p>
                </div>
                
                <button class="btn-save" onclick="saveProfile()">設定変更を保存する</button>
                
                <a href="./users/index.html" class="back-link">⬅️ マイページに戻して確認する</a>
            </div>

        </div>
    </main>

    <script>
        window.onload = function() {
            loadCurrentProfile();
        };

        // 現在入っている名前とアイコンURLを最初からフォームに表示させておく
        function loadCurrentProfile() {
            const savedName = localStorage.getItem('username') || '';
            const savedAvatar = localStorage.getItem('userAvatar') || '';
            document.getElementById('username-input').value = savedName;
            document.getElementById('avatar-input').value = savedAvatar;
        }

        // 変更保存
        function saveProfile() {
            const newName = document.getElementById('username-input').value.trim();
            const newAvatar = document.getElementById('avatar-input').value.trim();

            if(!newName) {
                alert('ユーザー名が空欄です。入力してください！');
                return;
            }

            localStorage.setItem('username', newName);
            localStorage.setItem('userAvatar', newAvatar);
            
            alert('プロフィールの変更内容を保存しました！');
        }

        // 👇 3. Googleログインが成功した時に動くJavaScriptのプログラム
        function handleCredentialResponse(response) {
            // Googleから届いた暗号化データを解読する
            const responsePayload = parseJwt(response.credential);

            console.log("ID: " + responsePayload.sub);
            console.log('Full Name: ' + responsePayload.name);
            console.log('Given Name: ' + responsePayload.given_name);
            console.log('Family Name: ' + responsePayload.family_name);
            console.log("Image URL: " + responsePayload.picture);
            console.log("Email: " + responsePayload.email);

            // 取得した「Googleの名前」と「Googleのアイコン画像」を入力欄に自動セット
            document.getElementById('username-input').value = responsePayload.name;
            document.getElementById('avatar-input').value = responsePayload.picture;

            // ローカルストレージ（ブラウザ内）にも即時保存
            localStorage.setItem('username', responsePayload.name);
            localStorage.setItem('userAvatar', responsePayload.picture);

            alert('Googleログインに成功しました！名前とアイコンを自動セットしました。');
        }

        // JWT（Googleのデータ）を解読するための必須のオマジナイ関数
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload);
        }
    </script>
</body>
</html>
